name: UE5 Morvella attack footprint policy
on:
  pull_request:
    paths:
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallDeathGoddess*.h'
      - 'tests/cpp/test_morvella_footprints.cpp'
      - '.github/workflows/morvella-footprints.yml'
  push:
    paths:
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallDeathGoddess*.h'
      - 'tests/cpp/test_morvella_footprints.cpp'
      - '.github/workflows/morvella-footprints.yml'
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -I. tests/cpp/test_morvella_footprints.cpp -o /tmp/morvella && /tmp/morvella
