name: UE5 gear advisor portable policy
on:
  pull_request:
    paths:
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallGearAdvisorPolicy.h'
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallHeroPawn.cpp'
      - 'tools/test_unreal_gear_advisor_policy.cpp'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
  workflow_dispatch:
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: GCC
        if: runner.os == 'Linux'
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/test_unreal_gear_advisor_policy.cpp -o /tmp/gear-advisor
          /tmp/gear-advisor
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fe:gear-advisor.exe tools/test_unreal_gear_advisor_policy.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gear-advisor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
