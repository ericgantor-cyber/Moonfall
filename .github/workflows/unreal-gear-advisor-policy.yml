name: UE5 gear advisor portable policy
on:
  push:
    branches: [main]
    paths:
      - 'MoonfallUnreal/Source/**'
      - 'tools/test_unreal_*.cpp'
      - 'tools/test_v27_*.cpp'
      - 'tools/Test-UnrealPortableMSVC.ps1'
      - 'tools/run_unreal_sanitizer.sh'
      - 'tools/run_unreal_portable_gcc.sh'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
  pull_request:
    paths:
      - 'MoonfallUnreal/Source/**'
      - 'tools/test_unreal_*.cpp'
      - 'tools/test_v27_*.cpp'
      - 'tools/Test-UnrealPortableMSVC.ps1'
      - 'tools/run_unreal_sanitizer.sh'
      - 'tools/run_unreal_portable_gcc.sh'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moonfall-gear-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: GCC
        id: gcc
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/test_unreal_gear_advisor_policy.cpp -o /tmp/gear-advisor
          /tmp/gear-advisor
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic -DMOONFALL_V19_EDITOR_PREVIEW=1 tools/test_unreal_gear_advisor_policy.cpp -o /tmp/gear-advisor-v19
          /tmp/gear-advisor-v19
      - name: Compile and run all other portable C++ policies with GCC
        id: gcc_portable
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        env:
          MOONFALL_POLICY_RESULTS: ${{ runner.temp }}/MoonfallCompiler-${{ github.run_id }}-${{ github.run_attempt }}.tsv
        run: bash tools/run_unreal_portable_gcc.sh
      - name: Clang address and undefined behavior sanitizers
        id: clang_sanitized
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          bash tools/run_unreal_sanitizer.sh tools/test_unreal_gear_advisor_policy.cpp
          bash tools/run_unreal_sanitizer.sh tools/test_unreal_gear_advisor_policy.cpp --v19-preview
      - uses: ilammy/msvc-dev-cmd@v1
        id: msvc_setup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Windows' }}
      - name: MSVC
        id: msvc
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.msvc_setup.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fe:gear-advisor.exe tools/test_unreal_gear_advisor_policy.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gear-advisor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cl /nologo /std:c++17 /W4 /WX /EHsc /DMOONFALL_V19_EDITOR_PREVIEW=1 /Fe:gear-advisor-v19.exe tools/test_unreal_gear_advisor_policy.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gear-advisor-v19.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run all other portable C++ policies with MSVC
        id: msvc_portable
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.msvc_setup.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        env:
          MOONFALL_POLICY_RESULTS: ${{ runner.temp }}/MoonfallCompiler-${{ github.run_id }}-${{ github.run_attempt }}.tsv
        run: ./tools/Test-UnrealPortableMSVC.ps1
      - name: Record test scope and checked-out revision
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          GCC_RESULT: ${{ steps.gcc.outcome }}
          GCC_PORTABLE_RESULT: ${{ steps.gcc_portable.outcome }}
          CLANG_RESULT: ${{ steps.clang_sanitized.outcome }}
          MSVC_RESULT: ${{ steps.msvc.outcome }}
          MSVC_PORTABLE_RESULT: ${{ steps.msvc_portable.outcome }}
        run: |
          set -euo pipefail
          {
            echo '### Equipment policy verification'
            echo "Checkout: $CHECKOUT_RESULT"
            if [[ "$CHECKOUT_RESULT" == success ]]; then
              echo "Checked-out revision: $(git rev-parse HEAD)"
            fi
            echo "Runner: $RUNNER_OS"
            echo 'Scope: standalone C++17 policy, default V17 and opt-in V19 preview on GCC/MSVC/Clang sanitizers; not Unreal Engine compilation or gameplay.'
            echo "| Compiler | Outcome |"
            echo "| --- | --- |"
            echo "| GCC equipment | ${GCC_RESULT:-not-run} |"
            echo "| GCC other portable policies | ${GCC_PORTABLE_RESULT:-not-run} |"
            echo "| Clang ASan/UBSan | ${CLANG_RESULT:-not-run} |"
            echo "| MSVC equipment | ${MSVC_RESULT:-not-run} |"
            echo "| MSVC other portable policies | ${MSVC_PORTABLE_RESULT:-not-run} |"
            echo 'Job status: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHECKOUT_RESULT" == success ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          if [[ "$RUNNER_OS" == Linux ]]; then
            [[ "$GCC_RESULT" == success && "$GCC_PORTABLE_RESULT" == success && "$CLANG_RESULT" == success ]]
          else
            [[ "$MSVC_RESULT" == success && "$MSVC_PORTABLE_RESULT" == success ]]
          fi
      - name: Write portable compiler verification evidence
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          GCC_RESULT: ${{ steps.gcc.outcome }}
          GCC_PORTABLE_RESULT: ${{ steps.gcc_portable.outcome }}
          CLANG_RESULT: ${{ steps.clang_sanitized.outcome }}
          MSVC_RESULT: ${{ steps.msvc.outcome }}
          MSVC_PORTABLE_RESULT: ${{ steps.msvc_portable.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          e = os.environ
          linux = e['RUNNER_OS'] == 'Linux'
          prefix = 'GCC' if linux else 'MSVC'
          expected = {p.name for pattern in ('test_unreal_*.cpp', 'test_v27_*.cpp')
                      for p in Path('tools').glob(pattern)}
          gear = 'test_unreal_gear_advisor_policy.cpp'
          root = Path(e['RUNNER_TEMP'])
          stem = 'MoonfallCompiler-' + e['GITHUB_RUN_ID'] + '-' + e['GITHUB_RUN_ATTEMPT']
          raw = root / (stem + '.tsv')
          actual = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() if e['CHECKOUT_RESULT'] == 'success' else None
          results = []
          if raw.is_file():
              for line in raw.read_text(encoding='utf-8-sig').splitlines():
                  name, sep, status = line.partition('\t')
                  if sep:
                      results.append({'suite': name, 'outcome': status})
          names = [item['suite'] for item in results]
          complete = gear in expected and len(names) == len(set(names)) and set(names) == expected - {gear}
          results.append({'suite': gear, 'outcome': 'Passed' if e[prefix + '_RESULT'] == 'success' else e[prefix + '_RESULT']})
          verified = (actual == e['GITHUB_SHA'] and complete and e[prefix + '_PORTABLE_RESULT'] == 'success'
                      and all(item['outcome'] == 'Passed' for item in results)
                      and (not linux or e['CLANG_RESULT'] == 'success'))
          evidence = {
              'schema_version': 1, 'scope': 'standalone C++17 policy tests',
              'compiler': prefix, 'runner_os': e['RUNNER_OS'],
              'requested_sha': e['GITHUB_SHA'], 'checked_out_sha': actual,
              'run_id': e['GITHUB_RUN_ID'], 'run_attempt': e['GITHUB_RUN_ATTEMPT'],
              'expected_suite_count': len(expected), 'inventory_complete': complete,
              'verified': verified, 'suites': sorted(results, key=lambda item: item['suite']),
              'equipment_clang_sanitizer': e['CLANG_RESULT'] if linux else 'not-applicable',
              'native_unreal_compilation_verified': False, 'packaged_gameplay_verified': False,
          }
          (root / (stem + '.json')).write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          if not verified:
              raise SystemExit('Compiler evidence incomplete or tests failed.')
          PY
      - name: Preserve compiler verification report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: moonfall-portable-compiler-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/MoonfallCompiler-${{ github.run_id }}-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 30
