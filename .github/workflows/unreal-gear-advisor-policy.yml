name: UE5 gear advisor portable policy
on:
  push:
    branches: [main]
    paths:
      - 'MoonfallUnreal/Source/**'
      - 'tools/test_unreal_*.cpp'
      - 'tools/test_v27_*.cpp'
      - 'tools/Test-UnrealPortableMSVC.ps1'
      - 'tools/run_unreal_sanitizer.sh'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
  pull_request:
    paths:
      - 'MoonfallUnreal/Source/**'
      - 'tools/test_unreal_*.cpp'
      - 'tools/test_v27_*.cpp'
      - 'tools/Test-UnrealPortableMSVC.ps1'
      - 'tools/run_unreal_sanitizer.sh'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moonfall-gear-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  policy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: GCC
        id: gcc
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Werror -pedantic tools/test_unreal_gear_advisor_policy.cpp -o /tmp/gear-advisor
          /tmp/gear-advisor
      - name: Clang address and undefined behavior sanitizers
        id: clang_sanitized
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Linux' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_gear_advisor_policy.cpp
      - uses: ilammy/msvc-dev-cmd@v1
        id: msvc_setup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && runner.os == 'Windows' }}
      - name: MSVC
        id: msvc
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.msvc_setup.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /W4 /WX /EHsc /Fe:gear-advisor.exe tools/test_unreal_gear_advisor_policy.cpp
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./gear-advisor.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Compile and run all other portable C++ policies with MSVC
        id: msvc_portable
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && steps.msvc_setup.outcome == 'success' && runner.os == 'Windows' }}
        shell: pwsh
        run: ./tools/Test-UnrealPortableMSVC.ps1
      - name: Record test scope and checked-out revision
        if: ${{ !cancelled() }}
        shell: bash
        env:
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          GCC_RESULT: ${{ steps.gcc.outcome }}
          CLANG_RESULT: ${{ steps.clang_sanitized.outcome }}
          MSVC_RESULT: ${{ steps.msvc.outcome }}
          MSVC_PORTABLE_RESULT: ${{ steps.msvc_portable.outcome }}
        run: |
          set -euo pipefail
          {
            echo '### Equipment policy verification'
            echo "Checkout: $CHECKOUT_RESULT"
            if [[ "$CHECKOUT_RESULT" == success ]]; then
              echo "Checked-out revision: $(git rev-parse HEAD)"
            fi
            echo "Runner: $RUNNER_OS"
            echo 'Scope: standalone C++17 policy, not Unreal Engine compilation or gameplay.'
            echo "| Compiler | Outcome |"
            echo "| --- | --- |"
            echo "| GCC | ${GCC_RESULT:-not-run} |"
            echo "| Clang ASan/UBSan | ${CLANG_RESULT:-not-run} |"
            echo "| MSVC equipment | ${MSVC_RESULT:-not-run} |"
            echo "| MSVC other portable policies | ${MSVC_PORTABLE_RESULT:-not-run} |"
            echo 'Job status: ${{ job.status }}'
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$CHECKOUT_RESULT" == success ]]
          if [[ "$RUNNER_OS" == Linux ]]; then
            [[ "$GCC_RESULT" == success && "$CLANG_RESULT" == success ]]
          else
            [[ "$MSVC_RESULT" == success && "$MSVC_PORTABLE_RESULT" == success ]]
          fi
