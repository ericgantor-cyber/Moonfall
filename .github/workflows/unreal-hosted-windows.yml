name: Moonfall Unreal GitHub-hosted Windows feasibility and compile

# Explicit opt-in only. Hosted Windows machines do NOT include Unreal 5.4.
on:
  workflow_dispatch:
    inputs:
      attempt_compile:
        description: "Compile with your authorized UE 5.4 archive (requires secrets and ample disk)"
        required: true
        type: boolean
        default: false
      minimum_free_gb:
        description: "Minimum disk space required before Unreal download (recommended 80+ GB)"
        required: true
        type: number
        default: 80

permissions:
  contents: read

concurrency:
  group: moonfall-hosted-unreal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-preflight:
    runs-on: ${{ vars.MOONFALL_HOSTED_RUNNER || 'windows-2022' }}
    timeout-minutes: 15
    outputs:
      available_gb: ${{ steps.storage.outputs.available_gb }}
      has_capacity: ${{ steps.storage.outputs.has_capacity }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check Windows toolchain and disk capacity
        id: storage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporaryPath = [IO.Path]::GetFullPath($env:RUNNER_TEMP)
          $driveLetter = [IO.Path]::GetPathRoot($temporaryPath).TrimEnd('\')
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$driveLetter'"
          if (-not $disk) { throw 'Could not determine runner free disk space.' }
          $available = [math]::Round($disk.FreeSpace / 1GB, 1)
          "available_gb=$available" >> $env:GITHUB_OUTPUT
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) { throw 'Visual Studio installer not found on GitHub-hosted Windows runner.' }
          $vs = @(& $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
          if ($LASTEXITCODE -ne 0 -or -not ($vs | Where-Object { $_ })) {
            throw 'Visual Studio 2022 C++ toolchain missing on hosted runner.'
          }
          "Windows runner free disk: $available GB" >> $env:GITHUB_STEP_SUMMARY
          $minimumFreeGB = [double]${{ inputs.minimum_free_gb }}
          if ($minimumFreeGB -lt 35 -or $minimumFreeGB -gt 500) {
            throw 'minimum_free_gb must be between 35 and 500.'
          }
          $hasCapacity = $disk.FreeSpace -ge ($minimumFreeGB * 1GB)
          "has_capacity=$($hasCapacity.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          if (-not $hasCapacity) {
            Write-Warning "Hosted Windows runner has $available GB available, below the requested $minimumFreeGB GB."
            "Compile readiness: BLOCKED by disk space ($available GB < $minimumFreeGB GB)." >> $env:GITHUB_STEP_SUMMARY
            if ('${{ inputs.attempt_compile }}' -eq 'true') {
              throw 'Requested real Unreal compilation, but hosted runner lacks sufficient disk. Provision a larger runner and retry.'
            }
          } else {
            "Compile readiness: initial disk threshold $minimumFreeGB GB passed; engine size must still be verified." >> $env:GITHUB_STEP_SUMMARY
          }
          "Visual Studio 2022 C++ tools: detected" >> $env:GITHUB_STEP_SUMMARY
          "Unreal Engine is NOT preinstalled; no compilation was attempted during preflight." >> $env:GITHUB_STEP_SUMMARY
      - name: Note engine provisioning requirement
        shell: pwsh
        run: |
          "For real compilation, a separately licensed UE 5.4 installed build must be securely provided. Standard hosted Windows runners may not have enough disk." >> $env:GITHUB_STEP_SUMMARY
          "For a larger GitHub-hosted runner, provision it in your GitHub account and set the repository variable MOONFALL_HOSTED_RUNNER to its exact runner label." >> $env:GITHUB_STEP_SUMMARY
          "This workflow never automatically installs Unreal from Epic Games or exposes private engine archives." >> $env:GITHUB_STEP_SUMMARY

  compile-with-provided-engine:
    if: ${{ inputs.attempt_compile && needs.windows-preflight.outputs.has_capacity == 'true' }}
    needs: windows-preflight
    runs-on: ${{ vars.MOONFALL_HOSTED_RUNNER || 'windows-2022' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and validate private UE 5.4 installed-build archive
        shell: pwsh
        env:
          MOONFALL_UE54_ARCHIVE_URL: ${{ secrets.MOONFALL_UE54_ARCHIVE_URL }}
          MOONFALL_UE54_ARCHIVE_SHA256: ${{ secrets.MOONFALL_UE54_ARCHIVE_SHA256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:MOONFALL_UE54_ARCHIVE_URL -or -not $env:MOONFALL_UE54_ARCHIVE_SHA256) {
            throw 'Configure private MOONFALL_UE54_ARCHIVE_URL and MOONFALL_UE54_ARCHIVE_SHA256 secrets before enabling compilation.'
          }
          if ($env:MOONFALL_UE54_ARCHIVE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'UE archive SHA-256 secret must be a 64-character hexadecimal digest.'
          }
          $driveLetter = [IO.Path]::GetPathRoot([IO.Path]::GetFullPath($env:RUNNER_TEMP)).TrimEnd('\')
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$driveLetter'"
          if (-not $disk) { throw 'Cannot measure disk capacity on compilation runner.' }
          $minimumFreeGB = [double]${{ inputs.minimum_free_gb }}
          if ($disk.FreeSpace -lt $minimumFreeGB * 1GB) {
            throw "Compilation runner lacks $minimumFreeGB GB free; cannot safely provision Unreal."
          }
          $archive = Join-Path $env:RUNNER_TEMP 'ue54-installed.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'ue54-installed'
          # Archive URL must be an HTTPS, access-controlled download from a trusted provider.
          if (-not $env:MOONFALL_UE54_ARCHIVE_URL.StartsWith('https://')) {
            throw 'Installed engine archive URL must use HTTPS.'
          }
          Invoke-WebRequest -Uri $env:MOONFALL_UE54_ARCHIVE_URL -OutFile $archive -MaximumRedirection 0
          & .\MoonfallUnreal\Build\Test-UnrealInstalledArchive.ps1 -ArchivePath $archive -ExpectedSha256 $env:MOONFALL_UE54_ARCHIVE_SHA256 -DestinationRoot $destination -ReserveBytes 15GB
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          Remove-Item -LiteralPath $archive -Force
          $build = Join-Path $destination 'Engine\Build\BatchFiles\Build.bat'
          if (-not (Test-Path -LiteralPath $build -PathType Leaf)) {
            throw 'UE archive must have Engine/Build/BatchFiles/Build.bat at its root.'
          }
          "UE54_ROOT=$destination" >> $env:GITHUB_ENV
      - name: Compile MoonfallUnrealEditor with actual Unreal 5.4
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\MoonfallUnreal\Build\Build-Windows.ps1 -UnrealRoot $env:UE54_ROOT -CompileOnly
          if ($LASTEXITCODE -ne 0) { throw "Unreal compiler failed with exit code $LASTEXITCODE" }
          "Real Unreal Editor C++ compilation succeeded for ${{ github.sha }}." >> $env:GITHUB_STEP_SUMMARY
      - name: Upload Unreal diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Moonfall-Hosted-Windows-UE-Compile-Logs
          path: |
            MoonfallUnreal/Saved/Logs/
            MoonfallUnreal/Intermediate/Build/Win64/*.log
          if-no-files-found: warn
          retention-days: 7
