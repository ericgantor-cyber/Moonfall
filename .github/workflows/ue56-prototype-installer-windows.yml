name: Moonfall UE5.6 Windows installer (manual, untested)
# Trusted self-hosted runner only. Requires UE56_ROOT and Inno Setup 6.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonfall-ue56-installer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    runs-on: [self-hosted, Windows, X64, unreal-5-6]
    timeout-minutes: 210
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure runner-local build directories
        shell: pwsh
        run: |
          "MOONFALL_PACKAGE_DIR=$env:RUNNER_TEMP/MoonfallUE56InstallerInput/${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV
          "MOONFALL_SETUP_DIR=$env:RUNNER_TEMP/MoonfallUE56InstallerOutput/${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV
      - name: Checkout reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check trusted Unreal Windows runner
        run: |
          $ErrorActionPreference = 'Stop'
          & .\engine-comparison\unreal\MoonfallPrototype\Build\Check-WindowsRunner.ps1 -UnrealRoot $env:UE56_ROOT

      - name: Require Inno Setup 6 compiler before cooking
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Inno Setup 6 is missing from the trusted runner.'
          }

      - name: Compile cook and package fresh Moonfall game
        run: |
          $ErrorActionPreference = 'Stop'
          & .\engine-comparison\unreal\MoonfallPrototype\Build\Package-Windows.ps1 -UnrealRoot $env:UE56_ROOT -OutputDirectory $env:MOONFALL_PACKAGE_DIR

      - name: Headless boot smoke without modifying cooked archive
        run: |
          $ErrorActionPreference = 'Stop'
          & .\engine-comparison\unreal\MoonfallPrototype\Build\SmokeTest-Windows.ps1 -PackageDirectory $env:MOONFALL_PACKAGE_DIR -BootSeconds 25 -DiagnosticsDirectory (Join-Path $env:RUNNER_TEMP 'MoonfallSmokeDiagnostics')
          "Headless boot verified; visual gameplay remains UNTESTED." >> $env:GITHUB_STEP_SUMMARY

      - name: Create unsigned desktop-shortcut installer
        run: |
          $ErrorActionPreference = 'Stop'
          & .\engine-comparison\unreal\MoonfallPrototype\Build\Create-Installer-Windows.ps1 -PackageDirectory $env:MOONFALL_PACKAGE_DIR -OutputDirectory $env:MOONFALL_SETUP_DIR
          if (-not (Test-Path -LiteralPath (Join-Path $env:MOONFALL_SETUP_DIR 'InstallerBuildStatus.json'))) {
            throw 'Installer status manifest missing.'
          }
          "Unsigned installer created. Installation, shortcut and gameplay are UNTESTED." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer only after successful build and smoke
        uses: actions/upload-artifact@v4
        with:
          name: MoonfallPrototype-UE56-Unsigned-Installer-UNTESTED
          path: ${{ env.MOONFALL_SETUP_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if a step fails
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MoonfallPrototype-UE56-InstallerDiagnostics
          path: |
            engine-comparison/unreal/MoonfallPrototype/Saved/Logs/
            ${{ runner.temp }}/MoonfallSmokeDiagnostics/
          if-no-files-found: warn
          retention-days: 14
