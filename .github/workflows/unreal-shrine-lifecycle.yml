name: UE5 shrine lifecycle regression
on:
  pull_request:
    paths:
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallCheckpointShrine.*'
      - 'tools/test_unreal_shrine_lifecycle.py'
      - '.github/workflows/unreal-shrine-lifecycle.yml'
  push:
    paths:
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallCheckpointShrine.*'
      - 'tools/test_unreal_shrine_lifecycle.py'
      - '.github/workflows/unreal-shrine-lifecycle.yml'
jobs:
  shrine-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/test_unreal_shrine_lifecycle.py
