name: Moonfall Windows 10-11 build
on:
  push:
    branches:
      - moonfall-windows-ci-root-20261101
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 110
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    permissions:
      contents: read
    defaults:
      run:
        working-directory: godot-v38
    steps:
      - name: Checkout Moonfall source
        uses: actions/checkout@v4
      - name: Verify Windows project layout
        shell: pwsh
        run: |
          if (!(Test-Path 'project.godot')) { throw 'Missing project.godot' }
          if (!(Test-Path 'BUILD_MOONFALL_ONE_CLICK.ps1')) { throw 'Missing Windows build script' }
          if (!(Test-Path 'export_presets.cfg')) { throw 'Missing export preset' }
      - name: Install and verify Inno Setup 6 on CI
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey Inno Setup installation failed ($LASTEXITCODE)" }
          $candidatePaths = @(
            "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe",
            "${env:ProgramFiles}\\Inno Setup 6\\ISCC.exe"
          )
          $found = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (!$found) { throw 'ISCC.exe missing after installing Inno Setup 6.' }
          if (!(Test-Path -LiteralPath $found -PathType Leaf)) { throw "Missing Inno Setup compiler: $found" }
          Write-Host "Located Inno Setup 6 compiler: $found"
      - name: Validate launcher PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path (Get-Location) 'MoonfallLauncher.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_ }; throw 'Launcher PowerShell parse failed' }
          Write-Host 'PASS: Moonfall launcher PowerShell syntax'
      - name: Build and verify Windows game and installer
        shell: pwsh
        run: |
          ./BUILD_MOONFALL_ONE_CLICK.ps1
      - name: Run Phase 2 Godot combat and AI regressions
        shell: pwsh
        run: |
          $engine = Join-Path (Get-Location) 'Godot_4.7.2/Godot_v4.7.2-stable_win64.exe'
          if (!(Test-Path $engine)) { throw "Godot engine missing: $engine" }
          $suites = @(
            'guardian_attack_rules_test.gd',
            'guardian_attack_safety.gd',
            'companion_combat_phase2.gd',
            'companion_combat_phase2_hardening.gd',
            'boss_readout_phase2.gd',
            'boss_warning_lifecycle.gd',
            'boss_warning_performance.gd',
            'boss_warning_invalid_body.gd',
            'boss_warning_replacement_extended.gd',
            'enemy_combat_role_correction.gd',
            'enemy_combat_safety_v2.gd',
            'enemy_combat_live_integration.gd',
            'enemy_combat_performance_v3.gd',
            'enemy_combat_performance_v4.gd',
            'enemy_ai_phase2_review.gd',
            'enemy_last_seen_investigation.gd',
            'enemy_memory_expiry_hardening.gd',
            'enemy_reacquire_test.gd',
            'enemy_search_arrival_v2.gd',
            'enemy_search_braking.gd',
            'enemy_search_pause.gd',
            'enemy_search_lifecycle_v448.gd'
          )
          New-Item -ItemType Directory -Force -Path 'build/phase2-test-logs' | Out-Null
          $failed = @()
          foreach ($suite in $suites) {
            $log = Join-Path 'build/phase2-test-logs' ($suite + '.log')
            Write-Host "PHASE 2: $suite"
            $process = Start-Process -FilePath $engine -ArgumentList @("--headless", "--path", ".", "--script", ("res://tests/" + $suite)) -WorkingDirectory (Get-Location).Path -Wait -PassThru -RedirectStandardOutput $log -RedirectStandardError ($log + ".stderr")
            $exitCode = $process.ExitCode
            $output = (Get-Content -LiteralPath $log -Raw) + (Get-Content -LiteralPath ($log + ".stderr") -Raw)
            Write-Host "Suite $suite exited $exitCode; output bytes: $($output.Length)"
            if ($exitCode -ne 0 -or $output -match 'SCRIPT ERROR|Parse Error|Failed to load script|Assertion failed') {
              Write-Host $output
              $failed += $suite
            }
          }
          if ($failed.Count -gt 0) { throw ("Phase 2 failures: " + ($failed -join ', ')) }
          Write-Host "PASS: $($suites.Count) Phase 2 gameplay suites"
      - name: Verify distributable package inputs
        shell: pwsh
        run: |
          $required = @('build/MoonfallNative_v34_4.exe', 'build/moonfall-integrity.json', 'MoonfallLauncher.ps1', 'MoonfallLauncher.cmd', 'Release_Windows/Moonfall_Native_v34_4_Windows_Setup.exe')
          foreach ($file in $required) { if (!(Test-Path -LiteralPath $file -PathType Leaf)) { throw "Release package missing $file" } }
          $manifest = Get-Content 'build/moonfall-integrity.json' -Raw | ConvertFrom-Json
          $hash = (Get-FileHash 'build/MoonfallNative_v34_4.exe' -Algorithm SHA256).Hash
          if ($manifest.game_sha256 -ine $hash) { throw 'Release game hash mismatch' }
          Write-Host 'PASS: all distributable files present and executable SHA256 matches manifest'
      - name: Negative-test game integrity verification
        shell: pwsh
        run: |
          ./tools/Test-GameIntegrity.ps1 -GameExe 'build/MoonfallNative_v34_4.exe' -Manifest 'build/moonfall-integrity.json'
      - name: Assemble and verify portable launcher ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = 'build/portable-package'
          $zip = 'build/Moonfall-Windows-Portable.zip'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build/MoonfallNative_v34_4.exe' $stage
          Copy-Item 'build/moonfall-integrity.json' $stage
          Copy-Item 'MoonfallLauncher.ps1' $stage
          Copy-Item 'MoonfallLauncher.cmd' $stage
          Copy-Item 'WINDOWS_README.txt' $stage
          if (Test-Path 'build/GODOT_LICENSE.txt') { Copy-Item 'build/GODOT_LICENSE.txt' $stage }
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          $extract = 'build/portable-package-verify'
          Expand-Archive -LiteralPath $zip -DestinationPath $extract -Force
          $manifest = Get-Content (Join-Path $extract 'moonfall-integrity.json') -Raw | ConvertFrom-Json
          $actual = (Get-FileHash (Join-Path $extract 'MoonfallNative_v34_4.exe') -Algorithm SHA256).Hash
          if ($actual -ine $manifest.game_sha256) { throw 'Portable ZIP extraction checksum mismatch' }
          foreach ($name in @('MoonfallLauncher.ps1','MoonfallLauncher.cmd')) {
            if (!(Test-Path (Join-Path $extract $name))) { throw "Portable ZIP missing $name" }
          }
          # Validate the launcher exactly as it appears in the extracted download.
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $extract 'MoonfallLauncher.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw "Portable ZIP launcher syntax invalid: $($parseErrors.Count) errors" }
          $script = Get-Content (Join-Path $extract 'MoonfallLauncher.cmd') -Raw
          if ($script -notmatch 'MoonfallLauncher[.]ps1') { throw 'Portable launcher startup script does not invoke PowerShell launcher' }
          Write-Host 'PASS: extracted launcher syntax and startup script verified'
          Write-Host 'PASS: portable ZIP unpacked and SHA256 verified'
      - name: Write portable release checksum
        shell: pwsh
        run: |
          $zip = 'build/Moonfall-Windows-Portable.zip'
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'build/Moonfall-Windows-Portable.sha256' -Value $hash -Encoding ascii
          $recorded = (Get-Content 'build/Moonfall-Windows-Portable.sha256' -Raw).Trim()
          if ($recorded -ne $hash) { throw 'Portable checksum mismatch' }
          Write-Host 'PASS: portable ZIP checksum verified'
      - name: Write installer SHA256 for download verification
        shell: pwsh
        run: |
          $installer = 'Release_Windows/Moonfall_Native_v34_4_Windows_Setup.exe'
          if (!(Test-Path -LiteralPath $installer -PathType Leaf)) { throw 'Installer missing for checksum generation' }
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'build/Moonfall-Windows-Installer.sha256' -Value $hash -Encoding ascii
          $recorded = (Get-Content 'build/Moonfall-Windows-Installer.sha256' -Raw).Trim()
          if ($recorded -ne $hash) { throw 'Installer checksum mismatch' }
          Write-Host 'PASS: installer SHA256 generated and verified'
      - name: Publish verified Windows build evidence and binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: moonfall-windows-build-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            godot-v38/build/*.exe
            godot-v38/build/Moonfall-Windows-Portable.zip
            godot-v38/build/Moonfall-Windows-Portable.sha256
            godot-v38/build/Moonfall-Windows-Installer.sha256
            godot-v38/build/moonfall-integrity.json
            godot-v38/MoonfallLauncher.ps1
            godot-v38/MoonfallLauncher.cmd
            godot-v38/WINDOWS_README.txt
            godot-v38/build/*.json
            godot-v38/build/*.txt
            godot-v38/Release_Windows/*.exe
            godot-v38/GODOT_*_LOG.txt
            godot-v38/build/phase2-test-logs/*

      - name: Publish diagnostic logs when validation fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: moonfall-windows-failed-build-diagnostics
          if-no-files-found: warn
          retention-days: 7
          path: |
            godot-v38/GODOT_*_LOG.txt
            godot-v38/build/phase2-test-logs/*
            godot-v38/build/*failure*.txt
