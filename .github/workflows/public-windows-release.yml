name: Publish Moonfall Windows Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public release tag (example: v7.6.1)'
        required: true
        type: string
  # One-time, narrowly scoped v9.6.6 release. Manual releases still work.
  push:
    branches: [main]
    paths:
      - 'release-triggers/v9.6.6.txt'
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && 'v9.6.6' || inputs.version }}
    defaults:
      run:
        working-directory: Moonfall_7_6_Windows_Launcher_Fixes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version like v7.6.1' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize installer version with release tag
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          npm version $version --no-git-tag-version --no-commit-hooks
          $actual = (node -p "require('./package.json').version").Trim()
          if ($actual -ne $version) { throw "Package version $actual does not match release $version" }
      - name: Run Windows release regression tests
        run: |
          node modularize.js
          node --check modular/game.js
          node test-performance-overlay.js
          node test-render-scale.js
          node test-dx12-launch.js
          node test-direct3d-backend.js
          node test-gpu-support.js
          node test-speech-bubbles.js
          node audit-bloat.js
      - name: Build Windows setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:windows
      - name: Test native DX12 arena logic before publishing
        run: ctest --test-dir ../native/dx12-prototype/build --build-config Release --output-on-failure
      - name: Verify installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter 'Moonfall-*-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1000000) { throw 'Installer missing or unexpectedly small' }
          $expected = 'Moonfall-' + $env:RELEASE_TAG.Substring(1) + '-Windows-Setup.exe'
          if ($installer.Name -ne $expected) { throw "Installer name $($installer.Name) did not match $expected" }
          node --check modular/game.js
          $dx12 = Join-Path (Get-Location) 'dist/win-unpacked/resources/dx12/MoonfallDX12Prototype.exe'
          if (-not (Test-Path $dx12) -or (Get-Item $dx12).Length -lt 8000) { throw 'Bundled DirectX 12 demo missing' }
          $compiled = Join-Path (Get-Location) '../native/dx12-prototype/build/Release/MoonfallDX12Prototype.exe'
          if ((Get-FileHash $dx12).Hash -ne (Get-FileHash $compiled).Hash) { throw 'Bundled DX12 demo differs from compiled version' }
          Write-Host "Verified $($installer.Name) with native DX12 demo"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem dist -Filter 'Moonfall-*-Windows-Setup.exe' -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 1) { throw 'Expected exactly one setup executable' }
          gh release create $env:RELEASE_TAG $files[0] --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Moonfall $env:RELEASE_TAG" --notes "Windows 10/11 64-bit installer. Includes experimental playable DirectX 12 combat arena (Graphics menu). This is a separate abstract-shapes prototype, not a port of the original game or NVIDIA DLSS. Unsigned application: Windows SmartScreen may show a warning. Gameplay and installation on user hardware are not yet fully verified."
