name: Unreal source structure checks
on:
  push:
    paths:
      - 'MoonfallUnreal/**'
      - '.github/workflows/unreal-source-checks.yml'
  pull_request:
    paths:
      - 'MoonfallUnreal/**'
      - '.github/workflows/unreal-source-checks.yml'
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f MoonfallUnreal/MoonfallUnreal.uproject
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallEnemy.cpp
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallCombatHUD.cpp
          python3 - <<'PY'
          from pathlib import Path
          root = Path('MoonfallUnreal/Source')
          for path in root.rglob('*.cpp'):
              text = path.read_text()
              assert text.count('{') == text.count('}'), path
          config = Path('MoonfallUnreal/Config/DefaultEngine.ini').read_text()
          assert 'GameDefaultMap=/Engine/Maps/Entry' in config
          assert 'EditorStartupMap=/Engine/Maps/Entry' in config
          enemy = (root/'MoonfallUnreal'/'MoonfallEnemy.cpp').read_text()
          hero = (root/'MoonfallUnreal'/'MoonfallHeroPawn.cpp').read_text()
          assert 'NextPathRefreshAt' in enemy and 'CachedWaypoint' in enemy
          assert 'SetLifeSpan(1.25f)' in enemy
          assert 'if (!bOptionsOpen) AddControllerYawInput' in hero
          assert 'if (!bOptionsOpen) AddControllerPitchInput' in hero
          assert 'ManaRegenPerSecond' in hero and 'Tick(float DeltaSeconds)' in hero
          assert 'DamageImmunityUntil' in hero and 'NextDodgeAt' in hero
          assert 'GetLastMovementInputVector' in hero
          assert enemy.count('Nav->ProjectPointToNavigation(') == 1
          assert enemy.index('if (Now >= NextPathRefreshAt)') < enemy.index('Nav->ProjectPointToNavigation(')
          enemy_header = (root/'MoonfallUnreal'/'MoonfallEnemy.h').read_text()
          assert 'AttackSequence++ % 3' in enemy
          assert 'CurrentAttackMultiplier' in enemy and 'CurrentAttackRangeMultiplier' in enemy
          assert 'CurrentWindup' in enemy and 'CurrentWindup' in enemy_header
          assert 'TEXT("HEAVY")' in enemy and 'TEXT("SWEEP")' in enemy
          inputs = Path('MoonfallUnreal/Config/DefaultInput.ini').read_text()
          hud = (root/'MoonfallUnreal'/'MoonfallCombatHUD.cpp').read_text()
          assert 'ActionName="CastLeft",Key=LeftMouseButton' in inputs
          assert 'ActionName="CastRight",Key=RightMouseButton' in inputs
          assert 'ActionName="DualCast",Key=Gamepad_LeftTrigger' in inputs
          assert 'DrawArc(Radius * 0.85f' in hud and 'DrawArc(Radius * 0.97f' in hud
          assert 'DisplayHealth = FMath::FInterpTo' in hud and 'LevelGlowUntil' in hud
          print('Input mapping and combat source checks passed. Unreal compilation NOT performed.')
          PY
