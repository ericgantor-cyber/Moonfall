name: Unreal source structure checks
on:
  push:
    paths:
      - 'MoonfallUnreal/**'
      - 'tools/check_unreal_source.py'
      - '.github/workflows/unreal-source-checks.yml'
      - '.github/workflows/unreal-hosted-windows.yml'
  pull_request:
    paths:
      - 'MoonfallUnreal/**'
      - 'tools/check_unreal_source.py'
      - '.github/workflows/unreal-source-checks.yml'
      - '.github/workflows/unreal-hosted-windows.yml'
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f MoonfallUnreal/MoonfallUnreal.uproject
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallEnemy.cpp
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallCombatHUD.cpp
          python3 - <<'PY'
          from pathlib import Path
          center = Path('MoonfallUnreal/Build/Build-Center.ps1').read_text()
          assert 'BUILD MOONFALL' in center
          assert 'Setup-WindowsPrerequisites.ps1' in center
          assert 'Build-Windows.ps1' in center
          build_script = Path('MoonfallUnreal/Build/Build-Windows.ps1').read_text()
          compile_workflow = Path('.github/workflows/windows-unreal-preflight.yml').read_text()
          assert '[switch]$CompilePreflightOnly' in build_script
          assert 'if (-not $CompileOnly -and -not $CompilePreflightOnly) {' in build_script
          assert 'if ($CompilePreflightOnly) {' in build_script
          assert '-CompilePreflightOnly' in compile_workflow
          assert '-UnrealRoot $env:UE54_ROOT -PreflightOnly' not in compile_workflow
          assert 'CANCEL' in center and 'OPEN OUTPUT' in center
          root = Path('MoonfallUnreal/Source')
          for path in root.rglob('*.cpp'):
              text = path.read_text()
              assert text.count('{') == text.count('}'), path
          arena = (root/'MoonfallUnreal'/'MoonfallArena.cpp').read_text()
          assert '450.f*FMath::Sin(Angle),60.f' in arena
          config = Path('MoonfallUnreal/Config/DefaultEngine.ini').read_text()
          assert 'GameDefaultMap=/Engine/Maps/Entry' in config
          assert 'EditorStartupMap=/Engine/Maps/Entry' in config
          enemy = (root/'MoonfallUnreal'/'MoonfallEnemy.cpp').read_text()
          hero = (root/'MoonfallUnreal'/'MoonfallHeroPawn.cpp').read_text()
          assert 'NextPathRefreshAt' in enemy and 'CachedWaypoint' in enemy
          assert 'SetLifeSpan(1.25f)' in enemy
          assert 'Health > 0.f && !bOptionsOpen && !bInventoryOpen && !bResidentContextOpen && FMath::IsFinite(Value)) AddControllerYawInput' in hero
          assert 'Health > 0.f && !bOptionsOpen && !bInventoryOpen && !bResidentContextOpen && FMath::IsFinite(Value)) AddControllerPitchInput' in hero
          assert 'ManaRegenPerSecond' in hero and 'Tick(float DeltaSeconds)' in hero
          assert 'DamageImmunityUntil' in hero and 'NextDodgeAt' in hero
          assert 'IncomingStage >= 12 ? 1 : IncomingStage + 1' in hero
          assert 'HitComboStage == 4 || HitComboStage == 8 || HitComboStage == 12' in hero
          assert 'HitComboStage > IncomingStage' in hero
          assert 'FMath::Clamp(EffectiveIncomingStage, 0, 3)' in hero
          assert 'OnSuccessfulHitCombo(HitComboStage, Hand == 0)' in hero
          assert 'GetLastMovementInputVector' in hero
          assert enemy.count('Nav->ProjectPointToNavigation(') == 1
          assert enemy.index('if (!FMath::IsFinite(NextPathRefreshAt) || Now >= NextPathRefreshAt)') < enemy.index('Nav->ProjectPointToNavigation(')
          enemy_header = (root/'MoonfallUnreal'/'MoonfallEnemy.h').read_text()
          assert 'AttackSequence++ %' in enemy and 'BossPhase >= 2' in enemy
          assert 'TEXT("ELITE CRUSH")' in enemy
          assert 'CurrentAttackMultiplier' in enemy and 'CurrentAttackRangeMultiplier' in enemy
          assert 'CurrentWindup' in enemy and 'CurrentWindup' in enemy_header
          assert 'TEXT("HEAVY")' in enemy and 'TEXT("SWEEP")' in enemy
          inputs = Path('MoonfallUnreal/Config/DefaultInput.ini').read_text()
          hud = (root/'MoonfallUnreal'/'MoonfallCombatHUD.cpp').read_text()
          # Context-aware mouse handlers preserve combat when not on an NPC.
          assert 'ActionName="ResidentMouseClick",Key=LeftMouseButton' in inputs
          assert 'ActionName="CastRightMouse",Key=RightMouseButton' in inputs
          assert 'ActionName="CastLeft",Key=Z' in inputs
          assert 'ActionName="CastRight",Key=X' in inputs
          assert 'CastLeft(); return;' in hero and 'CastRight();' in hero
          assert 'ActionName="TalkNPC"' not in inputs
          assert 'ActionName="ResidentQuest"' not in inputs
          assert 'ActionName="DualCast",Key=Gamepad_LeftTrigger' in inputs
          assert 'DrawArc(Radius * 0.85f' in hud and 'DrawArc(Radius * 0.97f' in hud
          assert 'DisplayHealth = FMath::FInterpTo' in hud and 'LevelGlowUntil' in hud
          print('Input mapping and combat source checks passed. Unreal compilation NOT performed.')
          PY

      # Check the actual game integration contracts on every Unreal source change.
      # This is not a native UE5 build; use the dedicated Windows engine runner for that.
      - name: Run complete Unreal integration regression tests
        shell: bash
        run: python3 tools/check_unreal_source.py

      - name: Parse Windows build scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem MoonfallUnreal/Build -Filter '*.ps1' -Recurse -File
          if ($scripts.Count -eq 0) { throw 'No Windows build scripts found' }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse error in $($script.FullName): $($errors -join '; ')" }
            Write-Host "Parsed $($script.Name)"
          }

      - name: Parse GitHub-hosted Unreal inline PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content -LiteralPath '.github/workflows/unreal-hosted-windows.yml')
          $parsed = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -notmatch '^\s{8}run:\s*\|\s*
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./MoonfallUnreal/Build/Test-UnrealEngineVersion.Tests.ps1
          $localBuild = Get-Content -LiteralPath 'MoonfallUnreal/Build/Build-Windows.ps1' -Raw
          $hostedBuild = Get-Content -LiteralPath '.github/workflows/unreal-windows-build.yml' -Raw
          if ($localBuild -notmatch 'Test-UnrealEngineVersion\.ps1') {
            throw 'Local Windows build bypasses Unreal version validation.'
          }
          if ($hostedBuild -notmatch 'Test-UnrealEngineVersion\.ps1') {
            throw 'Self-hosted Windows build bypasses Unreal version validation.'
          }
          Write-Host 'Both Unreal Windows build entrypoints call the tested engine version guard.'

      - name: Validate Unreal project and module configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('MoonfallUnreal/MoonfallUnreal.uproject').read_text())
          assert project['EngineAssociation'] == '5.4'
          assert any(m['Name'] == 'MoonfallUnreal' and m['Type'] == 'Runtime' for m in project['Modules'])
          module = Path('MoonfallUnreal/Source/MoonfallUnreal/MoonfallUnreal.Build.cs').read_text()
          for dependency in ('Core', 'CoreUObject', 'Engine', 'InputCore', 'NavigationSystem'):
              assert '"'+dependency+'"' in module, dependency
          targets = list(Path('MoonfallUnreal/Source').glob('*.Target.cs'))
          assert targets, 'Missing Unreal target definitions'
          print('Unreal 5.4 project metadata, module dependencies and targets validated.')
          PY
) { continue }
            $body = [System.Collections.Generic.List[string]]::new()
            for ($j = $i + 1; $j -lt $lines.Count; $j++) {
              $line = $lines[$j]
              if ($line.Trim().Length -gt 0 -and $line -notmatch '^\s{10,}') { break }
              if ($line -match '^\s{10}') {
                $body.Add($line.Substring(10))
              } else {
                $body.Add('')
              }
            }
            if ($body.Count -eq 0) { throw "Empty inline script at workflow line $($i + 1)" }
            # Github replaces expression tokens before executing run blocks.
            # Parse a neutral stand-in to catch genuine PowerShell syntax mistakes.
            $source = [regex]::Replace(($body -join [Environment]::NewLine), '\$\{\{.*?\}\}', '0')
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "Hosted Unreal inline PowerShell parse error at workflow line $($i + 1): $($errors -join '; ')"
            }
            $parsed++
          }
          if ($parsed -lt 6) { throw "Expected at least six hosted PowerShell run blocks, parsed $parsed" }
          Write-Host "Parsed $parsed hosted Unreal PowerShell blocks. Native UE5 compilation NOT performed."

      - name: Test Unreal 5.4 engine guard with synthetic installations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./MoonfallUnreal/Build/Test-UnrealEngineVersion.Tests.ps1
          $localBuild = Get-Content -LiteralPath 'MoonfallUnreal/Build/Build-Windows.ps1' -Raw
          $hostedBuild = Get-Content -LiteralPath '.github/workflows/unreal-windows-build.yml' -Raw
          if ($localBuild -notmatch 'Test-UnrealEngineVersion\.ps1') {
            throw 'Local Windows build bypasses Unreal version validation.'
          }
          if ($hostedBuild -notmatch 'Test-UnrealEngineVersion\.ps1') {
            throw 'Self-hosted Windows build bypasses Unreal version validation.'
          }
          Write-Host 'Both Unreal Windows build entrypoints call the tested engine version guard.'

      - name: Validate Unreal project and module configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('MoonfallUnreal/MoonfallUnreal.uproject').read_text())
          assert project['EngineAssociation'] == '5.4'
          assert any(m['Name'] == 'MoonfallUnreal' and m['Type'] == 'Runtime' for m in project['Modules'])
          module = Path('MoonfallUnreal/Source/MoonfallUnreal/MoonfallUnreal.Build.cs').read_text()
          for dependency in ('Core', 'CoreUObject', 'Engine', 'InputCore', 'NavigationSystem'):
              assert '"'+dependency+'"' in module, dependency
          targets = list(Path('MoonfallUnreal/Source').glob('*.Target.cs'))
          assert targets, 'Missing Unreal target definitions'
          print('Unreal 5.4 project metadata, module dependencies and targets validated.')
          PY
