name: Unreal source structure checks
on:
  push:
    paths:
      - 'MoonfallUnreal/**'
      - 'tools/check_unreal_source.py'
      - 'tools/test_unreal_*.py'
      - 'tools/test_unreal_*.cpp'
      - 'tools/test_v27_*.cpp'
      - 'tools/run_unreal_sanitizer.sh'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
      - 'tests/test_movement_only_keyboard.py'
      - '.github/workflows/unreal-source-checks.yml'
      - '.github/workflows/unreal-hosted-windows.yml'
      - '.github/workflows/unreal-windows-build.yml'
      - '.github/workflows/windows-unreal-preflight.yml'
      - '.github/workflows/unreal-compile-windows.yml'
  pull_request:
    paths:
      - 'MoonfallUnreal/**'
      - 'tools/check_unreal_source.py'
      - 'tools/test_unreal_*.py'
      - 'tools/test_unreal_*.cpp'
      - 'tools/test_v27_*.cpp'
      - 'tools/run_unreal_sanitizer.sh'
      - '.github/workflows/unreal-gear-advisor-policy.yml'
      - 'tests/test_movement_only_keyboard.py'
      - '.github/workflows/unreal-source-checks.yml'
      - '.github/workflows/unreal-hosted-windows.yml'
      - '.github/workflows/unreal-windows-build.yml'
      - '.github/workflows/windows-unreal-preflight.yml'
      - '.github/workflows/unreal-compile-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: moonfall-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          persist-credentials: false
      - name: Validate Unreal source layout
        id: check_validate_unreal_source_layout
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f MoonfallUnreal/MoonfallUnreal.uproject
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallEnemy.cpp
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallCombatHUD.cpp
          python3 - <<'PY'
          from pathlib import Path
          center = Path('MoonfallUnreal/Build/Build-Center.ps1').read_text()
          assert 'BUILD MOONFALL' in center
          assert 'Setup-WindowsPrerequisites.ps1' in center
          assert 'Build-Windows.ps1' in center
          build_script = Path('MoonfallUnreal/Build/Build-Windows.ps1').read_text()
          compile_workflow = Path('.github/workflows/windows-unreal-preflight.yml').read_text()
          assert '[switch]$CompilePreflightOnly' in build_script
          assert 'if (-not $CompileOnly -and -not $CompilePreflightOnly) {' in build_script
          assert 'if ($CompilePreflightOnly) {' in build_script
          assert '-CompilePreflightOnly' in compile_workflow
          assert '-UnrealRoot $env:UE54_ROOT -PreflightOnly' not in compile_workflow
          assert 'CANCEL' in center and 'OPEN OUTPUT' in center
          root = Path('MoonfallUnreal/Source')
          for path in root.rglob('*.cpp'):
              text = path.read_text()
              assert text.count('{') == text.count('}'), path
          arena = (root/'MoonfallUnreal'/'MoonfallArena.cpp').read_text()
          assert '450.f*FMath::Sin(Angle),60.f' in arena
          config = Path('MoonfallUnreal/Config/DefaultEngine.ini').read_text()
          assert 'GameDefaultMap=/Engine/Maps/Entry' in config
          assert 'EditorStartupMap=/Engine/Maps/Entry' in config
          enemy = (root/'MoonfallUnreal'/'MoonfallEnemy.cpp').read_text()
          hero = (root/'MoonfallUnreal'/'MoonfallHeroPawn.cpp').read_text()
          assert 'NextPathRefreshAt' in enemy and 'CachedWaypoint' in enemy
          assert 'SetLifeSpan(1.25f)' in enemy
          assert 'Health > 0.f && !bOptionsOpen && !bInventoryOpen && !bAtlasOpen && !bTalentWebOpen && !bResidentContextOpen && FMath::IsFinite(Value)) AddControllerYawInput' in hero
          assert 'Health > 0.f && !bOptionsOpen && !bInventoryOpen && !bAtlasOpen && !bTalentWebOpen && !bResidentContextOpen && FMath::IsFinite(Value)) AddControllerPitchInput' in hero
          assert 'ManaRegenPerSecond' in hero and 'Tick(float DeltaSeconds)' in hero
          assert 'DamageImmunityUntil' in hero and 'NextDodgeAt' in hero
          assert 'IncomingStage >= 12 ? 1 : IncomingStage + 1' in hero
          assert 'HitComboStage == 4 || HitComboStage == 8 || HitComboStage == 12' in hero
          assert 'HitComboStage > IncomingStage' in hero
          assert 'FMath::Clamp(EffectiveIncomingStage, 0, 3)' in hero
          cast = hero.split('bool AMoonfallHeroPawn::TryCast(', 1)[1].split('bool AMoonfallHeroPawn::TryPlayAuthoredSpellImpact(', 1)[0]
          assert 'if (ResolvedComboStage > 0) OnSuccessfulHitCombo(ResolvedComboStage, Hand == 0)' in cast
          assert cast.index('Mana -= Costs[School] * Multiplier;') < cast.index('OnSuccessfulHitCombo(ResolvedComboStage, Hand == 0)')
          assert 'GetLastMovementInputVector' in hero
          assert enemy.count('Nav->ProjectPointToNavigation(') == 1
          assert enemy.index('if (!FMath::IsFinite(NextPathRefreshAt) || Now >= NextPathRefreshAt)') < enemy.index('Nav->ProjectPointToNavigation(')
          enemy_header = (root/'MoonfallUnreal'/'MoonfallEnemy.h').read_text()
          assert 'AttackSequence++ %' in enemy and 'BossPhase >= 2' in enemy
          assert 'TEXT("ELITE CRUSH")' in enemy
          assert 'CurrentAttackMultiplier' in enemy and 'CurrentAttackRangeMultiplier' in enemy
          assert 'CurrentWindup' in enemy and 'CurrentWindup' in enemy_header
          assert 'TEXT("HEAVY")' in enemy and 'TEXT("SWEEP")' in enemy
          inputs = Path('MoonfallUnreal/Config/DefaultInput.ini').read_text()
          hud = (root/'MoonfallUnreal'/'MoonfallCombatHUD.cpp').read_text()
          # Context-aware mouse handlers preserve combat when not on an NPC.
          assert 'ActionName="ResidentMouseClick",Key=LeftMouseButton' in inputs
          assert 'ActionName="CastRightMouse",Key=RightMouseButton' in inputs
          assert 'ActionName="CastLeft",Key=Z' in inputs
          assert 'ActionName="CastRight",Key=X' in inputs
          assert 'RightHandAction(); return;' in hero and 'CastRight();' in hero
          assert 'ActionName="TalkNPC"' not in inputs
          assert 'ActionName="ResidentQuest"' not in inputs
          assert 'ActionName="DualCast",Key=Gamepad_LeftTrigger' in inputs
          assert 'DrawArc(Radius * 0.85f' in hud and 'DrawArc(Radius * 0.97f' in hud
          assert 'DisplayHealth = Hero->bReduceMotion ? ActualHealth : FMath::FInterpTo' in hud and 'LevelGlowUntil' in hud
          print('Input mapping and combat source checks passed. Unreal compilation NOT performed.')
          PY

      # Check the actual game integration contracts on every Unreal source change.
      # This is not a native UE5 build; use the dedicated Windows engine runner for that.
      - name: Run complete Unreal integration regression tests
        id: check_run_complete_unreal_integration_regression_tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/check_unreal_source.py

      - name: Compile and run original 141-node UE5 talent rules (C++17)
        id: check_compile_and_run_original_141_node_ue5_talent_rules_c_17
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tools/test_unreal_talent_rules.cpp -o /tmp/moonfall_talent_rules
          /tmp/moonfall_talent_rules

      - name: Compile and run performance audit and bug reporter regressions (C++17)
        id: check_compile_and_run_performance_audit_and_bug_reporter_regressions_c_17
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tools/test_unreal_performance_audit.cpp -o /tmp/moonfall_performance_audit
          /tmp/moonfall_performance_audit

      - name: Verify every UE5 talent matches the canonical 141-node catalog
        id: check_verify_every_ue5_talent_matches_the_canonical_141_node_catalog
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/test_unreal_talent_catalog_parity.py

      - name: Validate UE5 V13 talent save, load and rollback contracts
        id: check_validate_ue5_v13_talent_save_load_and_rollback_contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/test_unreal_talent_save_v13.py

      - name: Compile and test full 141-node talent-web layout and hit-testing
        id: check_compile_and_test_full_141_node_talent_web_layout_and_hit_testing
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 tools/test_unreal_talent_web.cpp -o /tmp/moonfall_talent_web
          /tmp/moonfall_talent_web

      - name: Verify shared UE5 panel chrome, focus highlights and compact accessibility
        id: check_verify_shared_ue5_panel_chrome_focus_highlights_and_compact_accessibility
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_modal_panels

      - name: Verify 12 saved racial passives and C character ancestry pages
        id: check_verify_12_saved_racial_passives_and_c_character_ancestry_pages
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/test_unreal_character_race_pages.py

      - name: Verify creator-to-gameplay ancestry save-backed confirmation
        id: check_verify_creator_to_gameplay_ancestry_save_backed_confirmation
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/test_unreal_creator_gameplay_bridge.py

      - name: Verify playable talent web input, modal safety and native HUD contracts
        id: check_verify_playable_talent_web_input_modal_safety_and_native_hud_contracts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/test_unreal_talent_ui.py

      - name: Verify red damage feedback and talent-web defeat recovery
        id: check_verify_red_damage_feedback_and_talent_web_defeat_recovery
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 tools/test_unreal_live_menu_damage.py

      - name: Verify WASD and arrow keys are movement-only across engines
        id: check_verify_wasd_and_arrow_keys_are_movement_only_across_engines
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest discover -s tests -p test_movement_only_keyboard.py -v

      - name: Verify native Omniattack and movement-only keyboard controls
        id: check_verify_native_omniattack_and_movement_only_keyboard_controls
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_omniattack

      - name: Verify buffered sword combos and enemy NPC pause behavior
        id: check_verify_buffered_sword_combos_and_enemy_npc_pause_behavior
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_combat_buffer

      - name: Verify Shattered Sanctuary gothic architecture and safe paths
        id: check_verify_shattered_sanctuary_gothic_architecture_and_safe_paths
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_sanctuary_architecture

      - name: Verify Firstlight tutorial and safe practice sentry AI
        id: check_verify_firstlight_tutorial_and_safe_practice_sentry_ai
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_firstlight_training

      - name: Verify six-region climate and living-world runtime
        id: check_verify_six_region_climate_and_living_world_runtime
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_living_world_runtime

      - name: Compile and execute V27 living AI policies (C++17)
        id: check_compile_and_execute_v27_living_ai_policies_c_17
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          for test in tools/test_v27_living_world_policy.cpp tools/test_v27_npc_policy.cpp; do
            g++ -std=c++17 -Wall -Wextra -Werror -pedantic -O2 -I MoonfallUnreal/Source/MoonfallUnreal "$test" -o /tmp/moonfall_v27_policy
            /tmp/moonfall_v27_policy
          done

      - name: Verify UE5 combat momentum and immediate flinch regressions
        id: check_verify_ue5_combat_momentum_and_immediate_flinch_regressions
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_combat_integrity

      - name: Verify native Spell Book catalog, layout, and modal controls
        id: check_verify_native_spell_book_catalog_layout_and_modal_controls
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_spellbook

      # Guard the safety invariants that protect equipment ownership and pickups.
      # These are source contracts, not a native Unreal Engine compile or runtime test.
      - name: Run Unreal equipment and loot safety regression tests
        id: check_run_unreal_equipment_and_loot_safety_regression_tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v \
            tools.test_unreal_equipment_stat_validation \
            tools.test_unreal_loot_collection_safety

      - name: Verify combat HUD scan regressions
        id: check_verify_combat_hud_scan_regressions
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_combat_hud_scan

      - name: Verify enemy navigation budget regressions
        id: check_verify_enemy_navigation_budget_regressions
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_enemy_path_budget

      - name: Verify cooked content gates for Windows installer
        id: check_verify_cooked_content_gates_for_windows_installer
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: python3 -m unittest -v tools.test_unreal_windows_packaging_gate

      - name: Test Windows packaged root discovery with synthetic layouts
        id: check_test_windows_packaged_root_discovery_with_synthetic_layouts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./MoonfallUnreal/Build/Test-FindPackagedGame.Tests.ps1

      - name: Test native automation evidence parser with synthetic records
        id: check_test_native_automation_evidence_parser_with_synthetic_records
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./MoonfallUnreal/Build/Test-NativeAutomationResults.Tests.ps1

      - name: Parse Windows build scripts
        id: check_parse_windows_build_scripts
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem MoonfallUnreal/Build -Filter '*.ps1' -Recurse -File
          if ($scripts.Count -eq 0) { throw 'No Windows build scripts found' }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse error in $($script.FullName): $($errors -join '; ')" }
            Write-Host "Parsed $($script.Name)"
          }

      - name: Parse GitHub-hosted Unreal inline PowerShell
        id: check_parse_github_hosted_unreal_inline_powershell
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = @(Get-Content -LiteralPath '.github/workflows/unreal-hosted-windows.yml')
          $parsed = 0
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -notmatch '^\s{8}run:\s*\|\s*$') { continue }
            $body = [System.Collections.Generic.List[string]]::new()
            for ($j = $i + 1; $j -lt $lines.Count; $j++) {
              $line = $lines[$j]
              if ($line.Trim().Length -gt 0 -and $line -notmatch '^\s{10,}') { break }
              if ($line -match '^\s{10}') {
                $body.Add($line.Substring(10))
              } else {
                $body.Add('')
              }
            }
            if ($body.Count -eq 0) { throw "Empty inline script at workflow line $($i + 1)" }
            # Github replaces expression tokens before executing run blocks.
            # Parse a neutral stand-in to catch genuine PowerShell syntax mistakes.
            $source = [regex]::Replace(($body -join [Environment]::NewLine), '\$\{\{.*?\}\}', '0')
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseInput($source, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "Hosted Unreal inline PowerShell parse error at workflow line $($i + 1): $($errors -join '; ')"
            }
            $parsed++
          }
          if ($parsed -lt 6) { throw "Expected at least six hosted PowerShell run blocks, parsed $parsed" }
          Write-Host "Parsed $parsed hosted Unreal PowerShell blocks. Native UE5 compilation NOT performed."

      - name: Test Unreal 5.4 engine guard with synthetic installations
        id: check_test_unreal_5_4_engine_guard_with_synthetic_installations
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./MoonfallUnreal/Build/Test-UnrealEngineVersion.Tests.ps1
          $localBuild = Get-Content -LiteralPath 'MoonfallUnreal/Build/Build-Windows.ps1' -Raw
          $hostedBuild = Get-Content -LiteralPath '.github/workflows/unreal-windows-build.yml' -Raw
          if ($localBuild -notmatch 'Test-UnrealEngineVersion\.ps1') {
            throw 'Local Windows build bypasses Unreal version validation.'
          }
          if ($hostedBuild -notmatch 'Test-UnrealEngineVersion\.ps1') {
            throw 'Self-hosted Windows build bypasses Unreal version validation.'
          }
          Write-Host 'Both Unreal Windows build entrypoints call the tested engine version guard.'

      - name: Validate Unreal project and module configuration
        id: check_validate_unreal_project_and_module_configuration
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('MoonfallUnreal/MoonfallUnreal.uproject').read_text())
          assert project['EngineAssociation'] == '5.4'
          assert any(m['Name'] == 'MoonfallUnreal' and m['Type'] == 'Runtime' for m in project['Modules'])
          module = Path('MoonfallUnreal/Source/MoonfallUnreal/MoonfallUnreal.Build.cs').read_text()
          for dependency in ('Core', 'CoreUObject', 'Engine', 'InputCore', 'NavigationSystem'):
              assert '"'+dependency+'"' in module, dependency
          targets = list(Path('MoonfallUnreal/Source').glob('*.Target.cs'))
          assert targets, 'Missing Unreal target definitions'
          print('Unreal 5.4 project metadata, module dependencies and targets validated.')
          PY

      - name: Sanitize 141-node talent rules
        id: check_sanitize_talent_rules
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_talent_rules.cpp

      - name: Sanitize Talent web layout and hit testing
        id: check_sanitize_talent_web
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_talent_web.cpp

      - name: Sanitize Performance audit and bug reporter
        id: check_sanitize_performance
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_performance_audit.cpp

      - name: Sanitize Living world AI policy
        id: check_sanitize_living_world
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_v27_living_world_policy.cpp

      - name: Sanitize NPC AI policy
        id: check_sanitize_npc
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_v27_npc_policy.cpp

      - name: Sanitize Combat attack tells
        id: check_sanitize_attack_tells
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_attack_tell_visual.cpp

      - name: Sanitize Confirmed hit feedback
        id: check_sanitize_hit_feedback
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_impact_feedback.cpp

      - name: Sanitize Dungeon startup safety
        id: check_sanitize_dungeon_startup
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_dungeon_startup_policy.cpp

      - name: Sanitize Quest XP recovery
        id: check_sanitize_quest_xp
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_quest_xp.cpp

      - name: Sanitize Ferry route safety
        id: check_sanitize_ferry_routes
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_north_sea_passage.cpp

      - name: Sanitize Ferry automatic sailing
        id: check_sanitize_ferry_autosail
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_north_auto_sail.cpp

      - name: Sanitize Ferry dry landing safety
        id: check_sanitize_ferry_landing
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_north_dry_landing.cpp

      - name: Sanitize Combat attack outcomes
        id: check_sanitize_attack_outcome
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_attack_outcome.cpp

      - name: Sanitize Chronicle progression
        id: check_sanitize_chronicle
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_chronicle.cpp

      - name: Sanitize Chronicle UI
        id: check_sanitize_chronicle_ui
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_chronicle_ui.cpp

      - name: Sanitize Elite enemy tactics
        id: check_sanitize_elite_tactics
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_elite_tactics.cpp

      - name: Sanitize Forge crafting forecasts
        id: check_sanitize_forge_forecast
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: bash tools/run_unreal_sanitizer.sh tools/test_unreal_forge_forecast.cpp

      - name: Sanitize Guardian footprints
        id: check_sanitize_guardian_footprints
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
