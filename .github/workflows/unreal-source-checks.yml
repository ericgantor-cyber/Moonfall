name: Unreal source structure checks
on:
  push:
    paths:
      - 'MoonfallUnreal/**'
      - '.github/workflows/unreal-source-checks.yml'
  pull_request:
    paths:
      - 'MoonfallUnreal/**'
      - '.github/workflows/unreal-source-checks.yml'
jobs:
  source-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unreal source layout
        shell: bash
        run: |
          set -euo pipefail
          test -f MoonfallUnreal/MoonfallUnreal.uproject
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallEnemy.cpp
          test -f MoonfallUnreal/Source/MoonfallUnreal/MoonfallCombatHUD.cpp
          python3 - <<'PY'
          from pathlib import Path
          center = Path('MoonfallUnreal/Build/Build-Center.ps1').read_text()
          assert 'BUILD MOONFALL' in center
          assert 'Setup-WindowsPrerequisites.ps1' in center
          assert 'Build-Windows.ps1' in center
          assert 'CANCEL' in center and 'OPEN OUTPUT' in center
          root = Path('MoonfallUnreal/Source')
          for path in root.rglob('*.cpp'):
              text = path.read_text()
              assert text.count('{') == text.count('}'), path
          arena = (root/'MoonfallUnreal'/'MoonfallArena.cpp').read_text()
          assert '450.f*FMath::Sin(Angle),60.f' in arena
          config = Path('MoonfallUnreal/Config/DefaultEngine.ini').read_text()
          assert 'GameDefaultMap=/Engine/Maps/Entry' in config
          assert 'EditorStartupMap=/Engine/Maps/Entry' in config
          enemy = (root/'MoonfallUnreal'/'MoonfallEnemy.cpp').read_text()
          hero = (root/'MoonfallUnreal'/'MoonfallHeroPawn.cpp').read_text()
          assert 'NextPathRefreshAt' in enemy and 'CachedWaypoint' in enemy
          assert 'SetLifeSpan(1.25f)' in enemy
          assert 'if (!bOptionsOpen && !bWorldMapOpen) AddControllerYawInput' in hero
          assert 'if (!bOptionsOpen && !bWorldMapOpen) AddControllerPitchInput' in hero
          assert 'ManaRegenPerSecond' in hero and 'Tick(float DeltaSeconds)' in hero
          assert 'DamageImmunityUntil' in hero and 'NextDodgeAt' in hero
          assert 'GetLastMovementInputVector' in hero
          assert enemy.count('Nav->ProjectPointToNavigation(') == 1
          assert enemy.index('if (Now >= NextPathRefreshAt)') < enemy.index('Nav->ProjectPointToNavigation(')
          enemy_header = (root/'MoonfallUnreal'/'MoonfallEnemy.h').read_text()
          assert 'AttackSequence++ %' in enemy and 'BossPhase >= 2' in enemy
          assert 'TEXT("ELITE CRUSH")' in enemy
          assert 'CurrentAttackMultiplier' in enemy and 'CurrentAttackRangeMultiplier' in enemy
          assert 'CurrentWindup' in enemy and 'CurrentWindup' in enemy_header
          assert 'TEXT("HEAVY")' in enemy and 'TEXT("SWEEP")' in enemy
          inputs = Path('MoonfallUnreal/Config/DefaultInput.ini').read_text()
          hud = (root/'MoonfallUnreal'/'MoonfallCombatHUD.cpp').read_text()
          assert 'ActionName="CastLeft",Key=LeftMouseButton' in inputs
          assert 'ActionName="CastRight",Key=RightMouseButton' in inputs
          assert 'ActionName="DualCast",Key=Gamepad_LeftTrigger' in inputs
          assert 'ActionName="ZoomIn",Key=MouseScrollUp' in inputs
          assert 'ActionName="ZoomOut",Key=MouseScrollDown' in inputs
          assert 'BindAction(TEXT("ZoomIn")' in hero and 'BindAction(TEXT("ZoomOut")' in hero
          assert 'CameraDistance - 50.f' in hero and 'CameraDistance + 50.f' in hero
          assert 'FMath::Clamp(CameraDistance + (bReduceMotion ? 0.f : ImpactCameraOffset), 250.f, 850.f)' in hero
          assert 'FMath::FInterpTo(CameraBoom->TargetArmLength, TargetDistance' in hero
          assert 'ActionName="ZoomIn",Key=Gamepad_DPad_Up' in inputs
          assert 'ActionName="ZoomOut",Key=Gamepad_DPad_Down' in inputs
          assert 'DrawArc(Radius * 0.85f' in hud and 'DrawArc(Radius * 0.97f' in hud
          assert 'DisplayHealth = FMath::FInterpTo' in hud and 'LevelGlowUntil' in hud
          assert 'const float MapRange = FMath::Clamp(Hero->MinimapRange, 1200.f, 4800.f)' in hud
          assert 'DrawnEnemies < 32' in hud
          assert 'Delta.SizeSquared() > FMath::Square(MapRange)' in hud
          assert 'MapEnemy->bBoss ? FLinearColor' in hud
          assert 'MapCenter.X-3.f' in hud and 'MapCenter.Y-3.f' in hud
          hud_header = (root/'MoonfallUnreal'/'MoonfallCombatHUD.h').read_text()
          assert 'TArray<FIntPoint> ExploredMapCells' in hud_header
          assert 'ExploredMapCells.Num() >= 384' in hud
          assert 'ExploredMapCells.Contains(CurrentCell)' in hud
          assert 'const float CellSize = 200.f' in hud
          assert 'FMath::Clamp(Hero->MinimapRange, 1200.f, 4800.f)' in hud
          assert 'MapRange/100.f' in hud
          assert 'ActionName="MinimapZoomIn",Key=Equals' in inputs
          assert 'ActionName="MinimapZoomOut",Key=Hyphen' in inputs
          assert 'BindAction(TEXT("MinimapZoomIn")' in hero and 'BindAction(TEXT("MinimapZoomOut")' in hero
          assert 'MinimapRange - 400.f, 1200.f, 4800.f' in hero
          assert 'MinimapRange + 400.f, 1200.f, 4800.f' in hero
          assert 'virtual void BeginPlay() override' in hud_header
          assert 'virtual void EndPlay(' in hud_header
          assert 'GConfig->GetArray(TEXT("Moonfall.Exploration")' in hud
          assert 'GConfig->SetArray(TEXT("Moonfall.Exploration")' in hud
          assert 'GConfig->Flush(false, GGameUserSettingsIni)' in hud
          assert 'NextExplorationSaveAt = Now + 15.f' in hud
          assert 'FDefaultValueHelper::ParseInt(' in hud
          assert 'bQuestTargetActive' in hero and 'SetQuestTarget(FVector WorldLocation)' in hero
          assert 'ClearQuestTarget()' in hero
          assert 'if (Hero->bQuestTargetActive)' in hud
          assert 'FMath::Min(QuestDistance, MapRange)' in hud
          assert 'bArenaBossQuestActive' in hud and 'QUEST: Defeat the Arena Boss' in hud
          assert 'FVector::Dist2D(Hero->GetActorLocation(), Hero->QuestTarget) / 100.f' in hud
          assert 'Boss->Health / FMath::Max(1.f, Boss->BossMaxHealth)' in hud
          assert 'TrackerWidth*Progress' in hud
          assert 'GetWorld()->GetTimeSeconds() - Hero->ArenaBossQuestCompletedAt < 5.f' in hud
          assert 'ArenaBossQuestCompletedAt = GetWorld()' in hero
          assert 'QUEST COMPLETE: Arena Boss' in hud
          assert 'BeginArenaBossQuest(FVector BossLocation)' in hero
          assert 'CompleteArenaBossQuest()' in hero
          assert 'if (!bArenaBossQuestActive || bArenaBossQuestComplete) return' in hero
          assert 'bArenaBossQuestComplete = true' in hero
          assert 'ClearQuestTarget();' in hero
          assert 'Hero->BeginArenaBossQuest(Enemy->GetActorLocation())' in arena
          assert 'if (bBoss) Hero->CompleteArenaBossQuest()' in enemy
          assert 'const FIntPoint CurrentCell' in hud and hud.index('const FIntPoint CurrentCell') < hud.index('if (Canvas->SizeX >= 700.f')
          assert 'CellOffset.SizeSquared() > FMath::Square(MapRange - CellSize)' in hud
          hero_header = (root/'MoonfallUnreal'/'MoonfallHeroPawn.h').read_text()
          assert 'bool bWorldMapOpen = false' in hero_header
          assert 'ActionName="WorldMap",Key=M' in inputs
          assert 'ActionName="WorldMap",Key=Gamepad_Special_Left' in inputs
          assert 'BindAction(TEXT("WorldMap")' in hero
          assert 'ToggleWorldMap()' in hero
          assert 'if (bOptionsOpen || bWorldMapOpen) return' in hero
          assert 'bOptionsOpen || bWorldMapOpen || !GetWorld()' in hero
          assert 'if (bOptionsOpen) bWorldMapOpen = false' in hero
          assert 'Hero->bOptionsOpen || Hero->bWorldMapOpen' in enemy
          assert 'DrawExplorationAtlas(Hero)' in hud
          assert 'const float HalfWorldRange = FMath::Clamp(Hero->WorldMapRange, 5000.f, 50000.f)' in hud
          assert 'WorldMapRange - 2500.f, 5000.f, 50000.f' in hero
          assert 'WorldMapRange + 2500.f, 5000.f, 50000.f' in hero
          assert 'if (bWorldMapOpen) WorldMapRange' in hero
          assert 'float WorldMapRange = 15000.f' in hero_header
          assert 'FMath::Clamp(RawTarget.Y,TopLeft.Y+70.f,TopLeft.Y+Height-16.f)' in hud
          assert 'HalfWorldRange/100.f' in hud
          assert 'FVector2D WorldMapPan = FVector2D::ZeroVector' in hero_header
          assert 'ActionName="WorldMapRecenter",Key=R' in inputs
          assert 'ActionName="WorldMapRecenter",Key=Gamepad_FaceButton_Top' in inputs
          assert 'BindAction(TEXT("WorldMapRecenter")' in hero
          assert 'WorldMapPan = FVector2D::ZeroVector' in hero
          assert 'WorldMapPan.Y + 2000.f' in hero and 'WorldMapPan.Y - 2000.f' in hero
          assert 'WorldMapPan.X + 2000.f' in hero and 'WorldMapPan.X - 2000.f' in hero
          assert 'const FVector2D Pan = Hero->WorldMapPan' in hud
          assert 'Player.X-Pan.X' in hud and 'Player.Y-Pan.Y' in hud
          assert 'const FVector2D RawPlayer = Centre + FVector2D(-Pan.X, Pan.Y) * Scale' in hud
          assert 'if (!bOptionsOpen && !bWorldMapOpen) CameraDistance' in hero
          assert 'bPersonalWaypointActive = false' in hero_header
          assert 'FVector PersonalWaypoint = FVector::ZeroVector' in hero_header
          assert 'ActionName="PlaceWaypoint",Key=T' in inputs
          assert 'ActionName="ClearWaypoint",Key=BackSpace' in inputs
          assert 'ActionName="PlaceWaypoint",Key=Gamepad_LeftShoulder' in inputs
          assert 'ActionName="ClearWaypoint",Key=Gamepad_RightShoulder' in inputs
          assert 'BindAction(TEXT("PlaceWaypoint")' in hero
          assert 'BindAction(TEXT("ClearWaypoint")' in hero
          assert 'Origin.X + WorldMapPan.X' in hero and 'Origin.Y + WorldMapPan.Y' in hero
          assert 'if (!bWorldMapOpen || bOptionsOpen) return' in hero
          assert 'if (Hero->bPersonalWaypointActive)' in hud
          assert 'const FVector WaypointOffset = Hero->PersonalWaypoint - Player' in hud
          assert 'FMath::Min(Distance,MapRange)' in hud
          assert 'if (Hero->bQuestTargetActive)' in hud
          assert 'for (const FIntPoint& Cell : ExploredMapCells)' in hud
          assert hud.index('const FIntPoint CurrentCell') < hud.index('if (Hero->bOptionsOpen)')
          assert hud.count('const FIntPoint CurrentCell') == 1
          print('Input mapping and combat source checks passed. Unreal compilation NOT performed.')
          PY

      - name: Parse Windows build scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scripts = Get-ChildItem MoonfallUnreal/Build -Filter '*.ps1' -Recurse -File
          if ($scripts.Count -eq 0) { throw 'No Windows build scripts found' }
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parse error in $($script.FullName): $($errors -join '; ')" }
            Write-Host "Parsed $($script.Name)"
          }

      - name: Validate Unreal project and module configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          project = json.loads(Path('MoonfallUnreal/MoonfallUnreal.uproject').read_text())
          assert project['EngineAssociation'] == '5.4'
          assert any(m['Name'] == 'MoonfallUnreal' and m['Type'] == 'Runtime' for m in project['Modules'])
          module = Path('MoonfallUnreal/Source/MoonfallUnreal/MoonfallUnreal.Build.cs').read_text()
          for dependency in ('Core', 'CoreUObject', 'Engine', 'InputCore', 'NavigationSystem'):
              assert '"'+dependency+'"' in module, dependency
          targets = list(Path('MoonfallUnreal/Source').glob('*.Target.cs'))
          assert targets, 'Missing Unreal target definitions'
          print('Unreal 5.4 project metadata, module dependencies and targets validated.')
          PY
