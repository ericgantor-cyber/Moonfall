name: Moonfall local uploader Windows verification
on:
  pull_request:
    paths:
      - 'MoonfallUnreal/Build/Upload-LocalTestResults.ps1'
      - 'MoonfallUnreal/Build/Install-LocalTestUpload.ps1'
      - '.github/workflows/moonfall-local-test-receipt.yml'
      - '.github/workflows/moonfall-local-uploader-check.yml'
  push:
    paths:
      - 'MoonfallUnreal/Build/Upload-LocalTestResults.ps1'
      - 'MoonfallUnreal/Build/Install-LocalTestUpload.ps1'
      - '.github/workflows/moonfall-local-test-receipt.yml'
      - '.github/workflows/moonfall-local-uploader-check.yml'
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and safe dry run
        shell: pwsh
        run: |
          $files = @('MoonfallUnreal/Build/Upload-LocalTestResults.ps1','MoonfallUnreal/Build/Install-LocalTestUpload.ps1')
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ('Invalid PowerShell: '+$f+' '+($errors|Out-String)) }
          }
          $project = Join-Path $env:RUNNER_TEMP 'test-project'
          $logs = Join-Path $project 'Saved/Logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $file = Join-Path $logs 'sample.log'
          Set-Content -LiteralPath $file -Value 'BUILD SUCCEEDED'
          (Get-Item $file).LastWriteTimeUtc = [DateTime]::UtcNow.AddMinutes(-2)
          $buildLogs = Join-Path $env:RUNNER_TEMP 'center-logs'
          New-Item -ItemType Directory -Force -Path $buildLogs | Out-Null
          $errorFile = Join-Path $buildLogs 'build-test.log.err'
          Set-Content -LiteralPath $errorFile -Value 'fatal error C1083: private path should not leak'
          (Get-Item $errorFile).LastWriteTimeUtc = [DateTime]::UtcNow.AddMinutes(-2)
          $output = & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $project -BuildLogRoot $buildLogs -DryRun
          if ($output.Count -ne 2) { throw 'Expected Unreal and Build Center dry-run receipts' }
          $payloads = @($output | ForEach-Object { $_ | ConvertFrom-Json })
          $unreal = @($payloads | Where-Object { $_.client_payload.source -eq 'unreal-log' })
          $center = @($payloads | Where-Object { $_.client_payload.source -eq 'build-center-log' })
          if ($unreal.Count -ne 1 -or $unreal[0].client_payload.outcome -ne 'passed') { throw 'Missing Unreal pass' }
          if ($center.Count -ne 1 -or $center[0].client_payload.outcome -ne 'failed') { throw 'Missing compiler failure' }
          if ($output -match 'sample.log|test-project|BUILD SUCCEEDED|private path|build-test.log') { throw 'Leaked source details' }
          # First-time setup must not flood GitHub with old histories.
          $old = Join-Path $logs 'old.log'
          Set-Content -LiteralPath $old -Value 'BUILD FAILED'
          (Get-Item $old).LastWriteTimeUtc = [DateTime]::UtcNow.AddDays(-9)
          $boundedRoot = Join-Path $env:RUNNER_TEMP 'batch-project'
          $boundedLogs = Join-Path $boundedRoot 'Saved/Logs'
          New-Item -ItemType Directory -Force -Path $boundedLogs | Out-Null
          foreach ($i in 1..12) {
            $logFile = Join-Path $boundedLogs ('run-' + $i + '.log')
            Set-Content -LiteralPath $logFile -Value ('BUILD SUCCEEDED ' + $i)
            (Get-Item $logFile).LastWriteTimeUtc = [DateTime]::UtcNow.AddMinutes(-2)
          }
          $batch = @( & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $boundedRoot -BuildLogRoot (Join-Path $boundedRoot 'no-center') -DryRun )
          if ($batch.Count -ne 10) { throw ('Expected at most 10 reports per cycle, got ' + $batch.Count) }
          $remaining = @( & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $project -BuildLogRoot $buildLogs -DryRun )
          if ($remaining.Count -ne 2) { throw 'Stale logs should not appear in receipts' }
          # Simulate GitHub refusing a dispatch, then accepting it, then a duplicate scan.
          $retryRoot = Join-Path $env:RUNNER_TEMP 'retry-project'
          $retryLogs = Join-Path $retryRoot 'Saved/Logs'
          New-Item -ItemType Directory -Force -Path $retryLogs | Out-Null
          $retryLog = Join-Path $retryLogs 'retry.log'
          Set-Content -LiteralPath $retryLog -Value 'BUILD SUCCEEDED'
          (Get-Item $retryLog).LastWriteTimeUtc = [DateTime]::UtcNow.AddMinutes(-2)
          $retryCache = Join-Path $env:RUNNER_TEMP 'retry-cache'
          $fakeGh = Join-Path $env:RUNNER_TEMP 'fake-gh.cmd'
          Set-Content -LiteralPath $fakeGh -Value @('@echo off','if "%MOONFALL_FAKE_GH_FAIL%"=="1" exit /b 1','exit /b 0')
          $env:MOONFALL_FAKE_GH_FAIL = '1'
          $failResult = @( & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $retryRoot -BuildLogRoot (Join-Path $retryRoot 'no-center') -CacheRoot $retryCache -GitHubCli $fakeGh 3>$null )
          if ($failResult.Count -ne 0) { throw 'Failed upload must not claim success' }
          $env:MOONFALL_FAKE_GH_FAIL = '0'
          $okResult = @( & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $retryRoot -BuildLogRoot (Join-Path $retryRoot 'no-center') -CacheRoot $retryCache -GitHubCli $fakeGh )
          if ($okResult.Count -ne 1 -or $okResult[0] -notmatch 'Sent Moonfall passed') { throw 'Failed upload was not retried' }
          $duplicateResult = @( & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $retryRoot -BuildLogRoot (Join-Path $retryRoot 'no-center') -CacheRoot $retryCache -GitHubCli $fakeGh )
          if ($duplicateResult.Count -ne 0) { throw 'Successful upload was duplicated' }
          Remove-Item Env:MOONFALL_FAKE_GH_FAIL -ErrorAction SilentlyContinue
          Write-Output 'Local uploader syntax and redacted dry run passed.'
