name: Moonfall local uploader Windows verification
on:
  pull_request:
    paths:
      - 'MoonfallUnreal/Build/Upload-LocalTestResults.ps1'
      - 'MoonfallUnreal/Build/Install-LocalTestUpload.ps1'
      - '.github/workflows/moonfall-local-test-receipt.yml'
      - '.github/workflows/moonfall-local-uploader-check.yml'
  push:
    paths:
      - 'MoonfallUnreal/Build/Upload-LocalTestResults.ps1'
      - 'MoonfallUnreal/Build/Install-LocalTestUpload.ps1'
      - '.github/workflows/moonfall-local-test-receipt.yml'
      - '.github/workflows/moonfall-local-uploader-check.yml'
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell syntax and safe dry run
        shell: pwsh
        run: |
          $files = @('MoonfallUnreal/Build/Upload-LocalTestResults.ps1','MoonfallUnreal/Build/Install-LocalTestUpload.ps1')
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f).Path,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ('Invalid PowerShell: '+$f+' '+($errors|Out-String)) }
          }
          $project = Join-Path $env:RUNNER_TEMP 'test-project'
          $logs = Join-Path $project 'Saved/Logs'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $file = Join-Path $logs 'sample.log'
          Set-Content -LiteralPath $file -Value 'BUILD SUCCEEDED'
          (Get-Item $file).LastWriteTimeUtc = [DateTime]::UtcNow.AddMinutes(-2)
          $buildLogs = Join-Path $env:RUNNER_TEMP 'center-logs'
          New-Item -ItemType Directory -Force -Path $buildLogs | Out-Null
          $errorFile = Join-Path $buildLogs 'build-test.log.err'
          Set-Content -LiteralPath $errorFile -Value 'fatal error C1083: private path should not leak'
          (Get-Item $errorFile).LastWriteTimeUtc = [DateTime]::UtcNow.AddMinutes(-2)
          $output = & ./MoonfallUnreal/Build/Upload-LocalTestResults.ps1 -ProjectRoot $project -BuildLogRoot $buildLogs -DryRun
          if ($output.Count -ne 2) { throw 'Expected Unreal and Build Center dry-run receipts' }
          $payloads = @($output | ForEach-Object { $_ | ConvertFrom-Json })
          $unreal = @($payloads | Where-Object { $_.client_payload.source -eq 'unreal-log' })
          $center = @($payloads | Where-Object { $_.client_payload.source -eq 'build-center-log' })
          if ($unreal.Count -ne 1 -or $unreal[0].client_payload.outcome -ne 'passed') { throw 'Missing Unreal pass' }
          if ($center.Count -ne 1 -or $center[0].client_payload.outcome -ne 'failed') { throw 'Missing compiler failure' }
          if ($output -match 'sample.log|test-project|BUILD SUCCEEDED|private path|build-test.log') { throw 'Leaked source details' }
          Write-Output 'Local uploader syntax and redacted dry run passed.'
