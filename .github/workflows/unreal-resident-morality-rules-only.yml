name: UE5 resident catalog and morality policy (C++17)
on:
  pull_request:
    paths:
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallResidentCatalog.h'
      - 'MoonfallUnreal/Source/MoonfallUnreal/MoonfallMoralityRules.h'
      - 'tools/test_unreal_resident_morality_only.cpp'
      - '.github/workflows/unreal-resident-morality-rules-only.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-catalog-and-ethics:
    name: 111 items and morality C++17 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run with GCC
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          g++ -std=c++17 -Wall -Wextra -Werror -O2 tools/test_unreal_resident_morality_only.cpp -o /tmp/moonfall_resident_morality
          /tmp/moonfall_resident_morality
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run with MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /WX tools/test_unreal_resident_morality_only.cpp /Fe:moonfall_resident_morality.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./moonfall_resident_morality.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
