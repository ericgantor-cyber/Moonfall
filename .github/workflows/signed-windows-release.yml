name: Publish Signed Moonfall Windows Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Public release tag (example: v7.6.1)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Moonfall_7_6_Windows_Launcher_Fixes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Use a version like v7.6.1' }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Synchronize installer version with release tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $version = $env:RELEASE_TAG.Substring(1)
          npm version $version --no-git-tag-version --no-commit-hooks
          $actual = (node -p "require('./package.json').version").Trim()
          if ($actual -ne $version) { throw "Package version $actual does not match release $version" }
      - name: Require signing credentials
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WIN_CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:WIN_CSC_KEY_PASSWORD)) {
            throw 'Code signing secrets WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD are required for signed releases.'
          }
      - name: Build Windows setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run build:windows
      - name: Verify installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $installer = Get-ChildItem dist -Filter 'Moonfall-*-Windows-Setup.exe' -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1000000) { throw 'Installer missing or unexpectedly small' }
          $expected = 'Moonfall-' + $env:RELEASE_TAG.Substring(1) + '-Windows-Setup.exe'
          if ($installer.Name -ne $expected) { throw "Installer name $($installer.Name) did not match $expected" }
          node --check modular/game.js
          $signature = Get-AuthenticodeSignature -FilePath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Installer signature invalid: $($signature.Status) $($signature.StatusMessage)" }
          if (-not $signature.SignerCertificate) { throw 'Missing installer signer certificate' }
          Write-Host "Validated Authenticode signature for $($signature.SignerCertificate.Subject)"
          Write-Host "Verified $($installer.Name)"
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version }}
        run: |
          $files = @(Get-ChildItem dist -Filter 'Moonfall-*-Windows-Setup.exe' -File | ForEach-Object { $_.FullName })
          if ($files.Count -ne 1) { throw 'Expected exactly one setup executable' }
          gh release create $env:RELEASE_TAG $files[0] --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Moonfall $env:RELEASE_TAG" --notes "Windows 10/11 64-bit installer. Authenticode signature validated during release build; SmartScreen may still warn until reputation is established. Gameplay and installation on user hardware are not yet fully verified."
