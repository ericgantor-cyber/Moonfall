name: Moonfall UE5.6 Windows playable package (manual)

# Manual trusted runner only. Compilation does not imply cooking, packaging or gameplay success.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonfall-ue56-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: [self-hosted, Windows, X64, unreal-5-6]
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Configure runner-local build directory
        shell: pwsh
        run: |
          "MOONFALL_PACKAGE_DIR=$env:RUNNER_TEMP/MoonfallUE56Package/${{ github.run_id }}-${{ github.run_attempt }}" >> $env:GITHUB_ENV
      - name: Check out reviewed revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify Windows UE5.6 build prerequisites
        run: |
          $ErrorActionPreference = 'Stop'
          & .\engine-comparison\unreal\MoonfallPrototype\Build\Check-WindowsRunner.ps1 -UnrealRoot $env:UE56_ROOT

      - name: Cook and package real UE5.6 Win64 game
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:UE56_ROOT) { throw 'UE56_ROOT is missing on the trusted Windows UE5.6 runner.' }
          $script = '.\engine-comparison\unreal\MoonfallPrototype\Build\Package-Windows.ps1'
          & $script -UnrealRoot $env:UE56_ROOT -OutputDirectory $env:MOONFALL_PACKAGE_DIR
          if ($LASTEXITCODE -ne 0) { throw "Package script failed: $LASTEXITCODE" }
          "Windows cooked game package created. Gameplay and installer not yet verified." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify build manifest exists before artifact upload
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MOONFALL_PACKAGE_DIR
          $manifest = Join-Path $root 'MoonfallPackageManifest.json'
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw 'The cooked package integrity manifest is missing.'
          }
          $data = Get-Content -LiteralPath $manifest -Raw | ConvertFrom-Json
          if ($data.project -ne 'MoonfallPrototype' -or
              $data.engine -ne '5.6' -or
              $data.tested_in_game -ne $false -or
              $data.installer -ne $false) {
            throw 'Packaging manifest is invalid or overstates verification.'
          }
          if (@($data.files).Count -eq 0) { throw 'Packaging manifest has no files.' }
          "Integrity manifest validated for an untested Win64 package." >> $env:GITHUB_STEP_SUMMARY

      - name: Verify packaged game boots into MoonfallWorld headlessly
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:MOONFALL_PACKAGE_DIR
          $smoke = '.\engine-comparison\unreal\MoonfallPrototype\Build\SmokeTest-Windows.ps1'
          & $smoke -PackageDirectory $root -BootSeconds 25 -DiagnosticsDirectory (Join-Path $env:RUNNER_TEMP 'MoonfallSmokeDiagnostics')
          "Packaged game passed a 25-second headless map boot smoke. Visual gameplay, saves and installer are UNTESTED." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload packaged game only after cook succeeds
        uses: actions/upload-artifact@v4
        with:
          name: MoonfallPrototype-UE56-Win64-UNTESTED
          path: ${{ env.MOONFALL_PACKAGE_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: MoonfallPrototype-UE56-PackageLogs
          path: |
            engine-comparison/unreal/MoonfallPrototype/Saved/Logs/
            engine-comparison/unreal/MoonfallPrototype/Intermediate/Build/Win64/
            ${{ runner.temp }}/MoonfallSmokeDiagnostics/
          if-no-files-found: warn
          retention-days: 14

      - name: Record limits
        if: always()
        run: |
          "Status: ${{ job.status }}" >> $env:GITHUB_STEP_SUMMARY
          "Requires trusted UE5.6 Windows runner and UE56_ROOT. The startup map is generated inside Unreal Editor if no authored level exists." >> $env:GITHUB_STEP_SUMMARY
          "Headless boot only. No desktop shortcut, signed installer, visual gameplay, input, save reload or benchmark is provided by this job." >> $env:GITHUB_STEP_SUMMARY
