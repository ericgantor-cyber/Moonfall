name: Moonfall source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moonfall_7_6_Windows_Launcher_Fixes
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game and launcher files
        shell: bash
        run: |
          set -euo pipefail
          for file in game.html main.js package.json verify-project.js test-save-system.js test-items.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required Moonfall file: $file"
              exit 1
            fi
          done
          node -e "const p=require('./package.json'); if (!p.scripts?.['build:windows'] || !p.dependencies?.three || !p.devDependencies?.electron || !p.devDependencies?.['electron-builder']) process.exit(1); console.log(p.name,p.version)"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done
      - name: Run Moonfall game regression checks
        run: node verify-project.js
      - name: Test boss phase engine
        run: node test-boss-phases.js
      - name: Verify boss integration in modular build
        run: |
          node modularize.js
          node --check modular/game.js
          node --check modular/boss-phases.browser.js
          node -e "const fs=require('fs');const h=fs.readFileSync('modular/game.html','utf8');const j=fs.readFileSync('modular/game.js','utf8');if(!h.includes('boss-phases.browser.js')||!j.includes('MoonfallBossPhases.updateBossPhase'))process.exit(1)"
      - name: Audit embedded asset sizes
        run: node audit-bloat.js
