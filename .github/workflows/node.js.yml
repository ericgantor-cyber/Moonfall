name: Moonfall source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moonfall_7_6_Windows_Launcher_Fixes
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game and launcher files
        shell: bash
        run: |
          set -euo pipefail
          for file in game.html main.js package.json verify-project.js test-save-system.js test-items.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required Moonfall file: $file"
              exit 1
            fi
          done
          node -e "const p=require('./package.json'); if (!p.scripts?.['build:windows'] || !p.dependencies?.three || !p.devDependencies?.electron || !p.devDependencies?.['electron-builder']) process.exit(1); console.log(p.name,p.version)"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done
      - name: Verify modular Windows game and prevent duplicate assets
        shell: bash
        run: |
          set -euo pipefail
          node modularize.js
          node --check modular/game.js
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const pkg=require('./package.json');
          const js=fs.readFileSync('modular/game.js','utf8');
          const html=fs.readFileSync('modular/game.html','utf8');
          assert(!pkg.build.files.includes('game.html'),'duplicate original game packaged');
          assert(!pkg.build.files.includes('modularize.js'),'unneeded builder script packaged');
          assert(js.includes('function mfEvade()'),'evade missing from game');
          assert(js.includes('function showLevelChoices()'),'automatic upgrades missing');
          assert(js.includes('closest=Infinity'),'linear enemy targeting missing');
          assert(html.includes('id="mfEvadeBtn"'),'evade button missing');
          assert(html.includes('id="levelCards"'),'upgrade cards missing');
          assert(js.includes('function mfTakeBoon(slot)'),'stage reward selection missing');
          assert(html.includes('id="mfBoonChoices"'),'stage reward UI missing');
          console.log('PASS: modular game, upgrade/dodge controls, targeting, package size');
          NODE
      - name: Test automatic level-up card interaction
        run: node test-level-cards.js
      - name: Run Moonfall game regression checks
        run: node verify-project.js
      - name: Test boss phase engine
        run: node test-boss-phases.js
      - name: Audit embedded asset sizes
        run: node audit-bloat.js
