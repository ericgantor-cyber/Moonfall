name: Moonfall source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moonfall_7_6_Windows_Launcher_Fixes
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate game and launcher files
        shell: bash
        run: |
          set -euo pipefail
          for file in game.html main.js package.json verify-project.js test-save-system.js test-items.js; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required Moonfall file: $file"
              exit 1
            fi
          done
          node -e "const p=require('./package.json'); if (!p.scripts?.['build:windows'] || !p.dependencies?.three || !p.devDependencies?.electron || !p.devDependencies?.['electron-builder']) process.exit(1); console.log(p.name,p.version)"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in *.js; do
            node --check "$file"
          done
      - name: Verify modular Windows game and prevent duplicate assets
        shell: bash
        run: |
          set -euo pipefail
          node modularize.js
          node --check modular/game.js
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const pkg=require('./package.json');
          const js=fs.readFileSync('modular/game.js','utf8');
          const html=fs.readFileSync('modular/game.html','utf8');
          assert(!pkg.build.files.includes('game.html'),'duplicate original game packaged');
          assert(!pkg.build.files.includes('modularize.js'),'unneeded builder script packaged');
          assert(js.includes('function mfEvade()'),'evade missing from game');
          assert(js.includes('function showLevelChoices()'),'automatic upgrades missing');
          assert(js.includes('closest=Infinity'),'linear enemy targeting missing');
          assert(html.includes('id="mfEvadeBtn"'),'evade button missing');
          assert(html.includes('id="levelCards"'),'upgrade cards missing');
          assert(js.includes('function mfTakeBoon(slot)'),'stage reward selection missing');
          assert(html.includes('id="mfBoonChoices"'),'stage reward UI missing');
          assert(js.includes('function mfSpawnElite()'),'miniboss logic missing');
          assert(js.includes('function mfReadMastery()'),'permanent mastery missing');
          assert(js.includes('function mfSetRoom()'),'room modifier missing');
          assert(html.includes('id="mfRoomHud"'),'room HUD missing');
          assert(js.includes('function mfCreateMob(e)'),'mob spawn integration missing');
          assert(js.includes('const COUNT=11111'),'mob catalog missing');
          assert(js.includes('e.mobVariant?.stats.speed'),'mob stat modifier missing');
          assert(js.includes('function mfRoleAttack(e)'),'new role attacks missing');
          assert(js.includes('function mfRoleMove(e,a,s)'),'enemy behaviors missing');
          assert(js.includes('function mfRouteButtons()'),'arena choice missing');
          assert(js.includes('mfHeroFlash=12'),'combat feedback missing');
          assert(js.includes('function mfBossExtra(e)'),'boss pattern AI missing');
          assert(js.includes('function mfBossWarningsDraw()'),'boss attack telegraph missing');
          assert(js.includes('function mfSanctuaryBuy(type)'),'Sanctuary purchasing missing');
          assert(js.includes('function mfElementAttack()'),'element attack missing');
          assert(js.includes('function mfToggleEffects()'),'accessibility effects toggle missing');
          assert(js.includes('function mfShowMilestone()'),'combo feedback missing');
          assert(html.includes('id="mfEffectsBtn"'),'visual effects control missing');
          assert(js.includes('function mfElementReset()'),'element reset missing');
          assert(html.includes('id="mfElementsHud"'),'element HUD missing');
          assert(js.includes('mfSanctuary.vitality*30'),'permanent vitality missing');
          assert(js.includes('mfSanctuary.evasion*5'),'permanent evasion mastery missing');
          assert(html.includes('id="mfSanctuary"'),'Sanctuary shop UI missing');
          assert(js.includes('mfBossExtra(e);mfEliteAttack(e);'),'boss updates not connected');
          assert(html.includes('.mf-route-options'),'route choice styles missing');
          console.log('PASS: modular game, upgrade/dodge controls, targeting, package size');
          NODE
      - name: Check clean reproducible builds and safe asset cleanup
        shell: bash
        run: |
          set -euo pipefail
          before=$(sha256sum modular/game.js modular/game.html | sha256sum | cut -d' ' -f1)
          echo 'stale generated asset' > modular/assets/art-999.webp
          echo 'keep unrelated asset' > modular/assets/readme.txt
          node modularize.js
          after=$(sha256sum modular/game.js modular/game.html | sha256sum | cut -d' ' -f1)
          test "$before" = "$after" || { echo "::error::Modular build is not deterministic"; exit 1; }
          test ! -e modular/assets/art-999.webp || { echo "::error::Stale generated art wasn't removed"; exit 1; }
          test -f modular/assets/readme.txt || { echo "::error::Unrelated asset was removed"; exit 1; }
          rm modular/assets/readme.txt
      - name: Test generated enemy roles and performance regressions
        run: node test-generated-combat.js
      - name: Test automatic level-up card interaction
        run: node test-level-cards.js
      - name: Run Moonfall game regression checks
        run: node verify-project.js
      - name: Test boss phase engine
        run: node test-boss-phases.js
      - name: Audit embedded asset sizes
        run: node audit-bloat.js
