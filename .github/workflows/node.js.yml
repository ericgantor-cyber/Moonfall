name: Moonfall source checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Moonfall_7_6_Windows_Launcher_Fixes
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if (!p.scripts?.['build:windows']) process.exit(1); console.log(p.name, p.version)"
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in *.js; do
            node --check "$file"
          done
      - name: Check required Windows game files
        shell: bash
        run: |
          for file in game.html assets/icon.ico; do
            if [ ! -f "$file" ]; then
              echo "::warning::Missing $file; Windows installer cannot be built until it is added."
            fi
          done
