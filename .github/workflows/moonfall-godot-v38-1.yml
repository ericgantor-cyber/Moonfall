name: Moonfall v38.1 Godot Windows CI
on:
  push:
    branches:
      - feature/moonfall-godot-v38-1-ci
    paths:
      - .github/workflows/moonfall-godot-v38-1.yml
      - native/godot-v38_1/**
  pull_request:
    paths:
      - .github/workflows/moonfall-godot-v38-1.yml
      - native/godot-v38_1/**
  workflow_dispatch:

permissions:
  contents: read

# Only the newest build for a branch needs to run. Prevent outdated red results
# and redundant Windows runner usage after successive test fixes.
concurrency:
  group: moonfall-v38-1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  import-release-source:
    # Import the published source on branch pushes only. A PR validates the already-imported files.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/moonfall-godot-v38-1-ci
          persist-credentials: true
      - name: Download, authenticate and import Moonfall v38.1 source
        shell: bash
        env:
          MOONFALL_ZIP_URL: https://github.com/ericgantor-cyber/Moonfall/releases/download/v38.1/Moonfall_38_1.zip
          MOONFALL_ZIP_SHA256: 75867cbe927c5a1e9f339985f956637f9920615083c7c3a615be15025b1e2eaf
        run: |
          set -euo pipefail
          if [ -f native/godot-v38_1/project.godot ]; then
            echo "Verified source already committed; skip redundant release download."
            exit 0
          fi
          curl --fail --location --retry 3 --silent --show-error "$MOONFALL_ZIP_URL" --output "$RUNNER_TEMP/moonfall-v38.1.zip"
          echo "$MOONFALL_ZIP_SHA256  $RUNNER_TEMP/moonfall-v38.1.zip" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, shutil, zipfile
          archive = pathlib.Path(os.environ['RUNNER_TEMP']) / 'moonfall-v38.1.zip'
          unpack = pathlib.Path(os.environ['RUNNER_TEMP']) / 'moonfall-v38.1-unpacked'
          dest = pathlib.Path('native/godot-v38_1')
          with zipfile.ZipFile(archive) as z:
              for info in z.infolist():
                  p = pathlib.PurePosixPath(info.filename)
                  if p.is_absolute() or '..' in p.parts or info.filename.startswith('\\'):
                      raise SystemExit('Unsafe path in release ZIP: ' + info.filename)
              z.extractall(unpack)
          projects = list(unpack.rglob('project.godot'))
          if len(projects) != 1:
              raise SystemExit(f'Expected exactly one project.godot; found {len(projects)}')
          src = projects[0].parent
          expected = ('BUILD_MOONFALL_ONE_CLICK.ps1', 'BUILD_WINDOWS.bat',
                      'scenes/main.tscn', 'tools/run_tests.py',
                      'docs/ART_SHA256_V36_2_ALL_IMAGES.txt')
          for item in expected:
              if not (src/item).exists():
                  raise SystemExit('Missing required Godot source file: ' + item)
          ignore = shutil.ignore_patterns('.git', '.godot', '__pycache__', 'Godot_4.7.2',
                                           'Release_Windows', 'build', '*.pyc')
          if (dest / 'project.godot').exists():
              print('Keeping committed source without overwriting local CI fixes')
          else:
              shutil.copytree(src, dest, dirs_exist_ok=True, ignore=ignore)
          print('Imported verified release into', dest, 'with',
                sum(p.is_file() for p in dest.rglob('*')), 'source files')
          PY
      - name: Commit imported Godot source to this feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- native/godot-v38_1
          if git diff --cached --quiet; then
            echo 'Source already matches v38.1 release.'
          else
            git commit -m 'Import SHA256-verified Moonfall Godot v38.1 source'
            git push origin HEAD:feature/moonfall-godot-v38-1-ci
          fi

  windows-godot-installer:
    needs: import-release-source
    if: always() && (needs.import-release-source.result == 'success' || needs.import-release-source.result == 'skipped')
    runs-on: windows-2022
    timeout-minutes: 110
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: native/godot-v38_1
    steps:
      - name: Checkout imported Godot branch
        uses: actions/checkout@v4
        with:
          ref: feature/moonfall-godot-v38-1-ci
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Godot project checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('project.godot', 'scenes/main.tscn', 'BUILD_WINDOWS.bat',
                              'BUILD_MOONFALL_ONE_CLICK.ps1', 'tools/run_tests.py',
                              'scripts/native_v38_0.gd')) {
            if (!(Test-Path -LiteralPath $path)) { throw "Missing: $path" }
          }
          python --version
      - name: Cache Godot 4.7.2 x64 export templates
        uses: actions/cache@v4
        with:
          path: native/godot-v38_1/Godot_4.7.2/export_templates
          key: godot-4.7.2-stable-windows-x64-template-f298490b8d44d934
      - name: Run all offline source checks, 66 Godot suites and export portable EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\BUILD_MOONFALL_ONE_CLICK.ps1 -PortableOnly
          if ($LASTEXITCODE -ne 0) { throw "Godot release gate failed: $LASTEXITCODE" }
      - name: Show exact Godot test failures in Actions summary
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $logs = @(Get-ChildItem -Path . -Filter 'GODOT_*_LOG.txt' -File | Sort-Object LastWriteTimeUtc)
          $problems = @()
          foreach ($file in $logs) {
            $bad = @(Get-Content -LiteralPath $file.FullName | Where-Object { $_ -match '(^ERROR:|SCRIPT ERROR|Parse Error|^MOONFALL .* FAIL$)' })
            if ($bad.Count -eq 0) { continue }
            $problems += "- $($file.Name): " + (($bad | Select-Object -First 4) -join ' | ')
          }
          if ($problems.Count -eq 0 -and $logs.Count -gt 0) {
            $latest = $logs[-1]
            $problems += "- Last executed suite: $($latest.Name) (no explicit error marker; inspect its log)"
          }
          if ($problems.Count -eq 0) {
            $problems += '- No Godot test log found; check the runner setup and source gates above.'
          }
          Write-Host 'MOONFALL FAILURE SUMMARY'
          $problems | ForEach-Object { Write-Host $_ }
          if ($env:GITHUB_STEP_SUMMARY) {
            '## Moonfall build failure: actual Godot log evidence' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $problems | ForEach-Object { $_ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }
            'Diagnostics ZIP contains the complete Godot logs.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }
      - name: Diagnose parent-script parsing after a failed Godot gate
        if: failure()
        continue-on-error: true
        shell: pwsh
        run: |
          $engine = '.\Godot_4.7.2\Godot_v4.7.2-stable_win64_console.exe'
          if (!(Test-Path -LiteralPath $engine -PathType Leaf)) { 
            Write-Warning "Godot console binary is unavailable: $engine"
          } else {
            $allOutput = & $engine --headless --path . --script res://tests/ci_inheritance_probe.gd 2>&1 | Out-String
            $allOutput | Set-Content -LiteralPath inheritance-probe.log -Encoding utf8
            Write-Host $allOutput
            Write-Host "Inheritance probe exit code: $LASTEXITCODE"
            if ($allOutput -match 'MOONFALL_PROBE.*FAILED|SCRIPT ERROR|Parse Error') {
              Write-Warning 'Godot parent-class parse errors identified'
            }
          }
      - name: Install Inno Setup 6 directly on CI runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco upgrade innosetup --yes --no-progress --force
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey install failed: $LASTEXITCODE" }
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno compiler missing at expected path: $compiler"
          }
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($compiler)
          Write-Host "Compiler: $compiler; FileVersion: $($version.FileVersion); ProductVersion: $($version.ProductVersion)"
      - name: Compile Windows installer using verified Inno Setup 6
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Inno Setup 6\ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno compiler missing' }
          & $compiler 'Moonfall_Native_v34_4_Setup.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno build failed: $LASTEXITCODE" }
          $game = 'build\MoonfallNative_v34_4.exe'
          $setup = 'Release_Windows\Moonfall_Native_v34_4_Windows_Setup.exe'
          if (!(Test-Path $game) -or !(Test-Path $setup)) { throw 'Game or installer missing' }
          .\VERIFY_WINDOWS_RELEASE.ps1 -GameExe $game -InstallerExe $setup -SkipLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Installer integrity verification failed' }
          $status = 'build\BUILD_STATUS_v38_1.json'
          $e = Get-Content -LiteralPath $status -Raw | ConvertFrom-Json
          $e.installer_built = $true
          $e.installer_exe = (Resolve-Path $setup).Path
          $e.installer_sha256 = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $e | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $status -Encoding utf8
      - name: Verify actual installed game, shortcuts and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path 'Release_Windows\Moonfall_Native_v34_4_Windows_Setup.exe').Path
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/TASKS=desktopicon') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $app = Join-Path $env:LOCALAPPDATA 'Programs\Moonfall Native'
          $installed = Join-Path $app 'MoonfallNative_v34_4.exe'
          if (!(Test-Path $installed)) { throw 'Installed game executable missing.' }
          $desktop = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Moonfall Native.lnk'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Moonfall Native.lnk'
          if (!(Test-Path $desktop) -or !(Test-Path $menu)) { throw 'Shortcut creation failed.' }
          # Exported game uses the Windows GUI subsystem. Direct invocation can
          # leave $LASTEXITCODE unset, so wait for the actual process exit.
          $stdout = Join-Path (Get-Location).Path 'installed-run.stdout.log'
          $stderr = Join-Path (Get-Location).Path 'installed-run.stderr.log'
          $launch = Start-Process -FilePath $installed -WorkingDirectory $app -ArgumentList @('--headless','--quit-after','180') -PassThru -Wait -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $output = @()
          foreach ($log in @($stdout,$stderr)) {
            if (Test-Path -LiteralPath $log) { $output += @(Get-Content -LiteralPath $log) }
          }
          # A GUI-subsystem executable may emit no stdout; still create the log.
          Set-Content -LiteralPath 'installed-run.log' -Value ($output -join [Environment]::NewLine) -Encoding utf8
          if ($output.Count -gt 0) { $output | Select-Object -Last 40 | ForEach-Object { Write-Host $_ } }
          Write-Host "Installed game process exited with code $($launch.ExitCode)"
          if ($launch.ExitCode -ne 0) { throw "Installed game headless launch failed: $($launch.ExitCode)" }
          if ((Get-Content installed-run.log -Raw) -match 'SCRIPT ERROR|Parse Error|ERROR:') {
            throw 'Installed game emitted a Godot error.'
          }
          $uninstall = Join-Path $app 'unins000.exe'
          if (!(Test-Path $uninstall)) { throw 'Inno uninstaller missing.' }
          $u = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART') -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Uninstall failed: $($u.ExitCode)" }
          Start-Sleep -Seconds 3
          if (Test-Path $installed) { throw 'Uninstall left the game executable behind.' }
          Write-Host 'PASS: installation, shortcuts, headless launch and uninstall'
      - name: Upload Windows installer, portable EXE and release evidence
        uses: actions/upload-artifact@v4
        with:
          name: Moonfall-v38.1-Godot-Windows-verified
          path: |
            native/godot-v38_1/build/MoonfallNative_v34_4.exe
            native/godot-v38_1/build/BUILD_STATUS_v38_1.json
            native/godot-v38_1/Release_Windows/Moonfall_Native_v34_4_Windows_Setup.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic logs if testing fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Moonfall-v38.1-Godot-Windows-build-diagnostics
          path: |
            native/godot-v38_1/build/BUILD_FAILURE_v38_1.txt
            native/godot-v38_1/GODOT_*_LOG.txt
            native/godot-v38_1/installed-run.log
            native/godot-v38_1/inheritance-probe.log
          if-no-files-found: ignore
          retention-days: 14
