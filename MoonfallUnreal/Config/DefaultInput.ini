; T, middle-click or D-pad down toggles lock-on. Tab cycles the locked enemy.
; Tab retains Chronicle focus in the Atlas; lock-next is gameplay-only.
; D-pad left/right switch locked enemies in combat and navigate menus/Atlas in overlays.
+ActionMappings=(ActionName="LockOn",Key=T)
